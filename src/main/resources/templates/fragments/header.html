<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern eCommerce Store - Premium Products at Great Prices">
    <title th:text="${title}">
        ShopHub - Your Premium Shopping Destination
    </title>

    <!-- Core CSS -->
    <link rel="stylesheet" th:href="@{/web/css/core.css}">
    <link rel="stylesheet" th:href="@{/web/css/footer.css}">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Inline styles for carousel -->
    <style>
        /* Hero Carousel Styles */
        .hero-carousel {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%);
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-slide.active {
            opacity: 1;
            z-index: 1;
        }

        .carousel-content {
            text-align: center;
            color: white;
            z-index: 2;
            max-width: 800px;
            padding: 2rem;
            animation: fadeIn 0.8s ease;
        }

        .carousel-content h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            margin-bottom: 1.5rem;
            font-weight: 800;
            line-height: 1.1;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .carousel-content p {
            font-size: clamp(1.125rem, 2vw, 1.5rem);
            margin-bottom: 2rem;
            opacity: 0.95;
            line-height: 1.6;
        }

        .carousel-slide-1 {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.9), rgba(139, 92, 246, 0.9)),
                url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1200') center/cover;
        }

        .carousel-slide-2 {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.9), rgba(245, 158, 11, 0.9)),
                url('https://images.unsplash.com/photo-1472851294608-062f824d29cc?w=1200') center/cover;
        }

        .carousel-slide-3 {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.9), rgba(14, 165, 233, 0.9)),
                url('https://images.unsplash.com/photo-1483985988355-763728e1935b?w=1200') center/cover;
        }

        /* Navigation Buttons */
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }

        .carousel-prev {
            left: 2rem;
        }

        .carousel-next {
            right: 2rem;
        }

        .carousel-prev,
        .carousel-next {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .carousel-prev:hover,
        .carousel-next:hover {
            background: rgba(255, 255, 255, 0.4);
            border-color: white;
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-next {
            transform: translateY(-50%);
        }

        .carousel-next:hover {
            transform: translateY(-50%) scale(1.1);
        }

        /* Dots Navigation */
        .carousel-dots {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            z-index: 10;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: scale(1.2);
        }

        .carousel-dot.active {
            background: white;
            width: 40px;
            border-radius: 10px;
        }

        /* Section Styles */
        .section-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .section-subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            max-width: 600px;
            margin: 1.5rem auto 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-carousel {
                height: 500px;
            }

            .carousel-prev,
            .carousel-next {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }

            .carousel-prev {
                left: 1rem;
            }

            .carousel-next {
                right: 1rem;
            }
        }

        @media (max-width: 480px) {
            .hero-carousel {
                height: 450px;
            }
        }
    </style>

</head>
