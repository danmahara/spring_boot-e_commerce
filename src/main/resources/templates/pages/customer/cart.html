<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">

<body>
    <section th:fragment="section">
        <!-- Include shared CSS -->
        <link rel="stylesheet" th:href="@{/web/css/user-pages.css}" />

        <!-- Page-specific styles -->
        <style>
            .cart-item {
                position: relative;
                overflow: hidden;
            }

            .cart-item::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                transform: scaleY(0);
                transition: transform 0.3s ease;
            }

            .cart-item:hover::before {
                transform: scaleY(1);
            }

            .cart-item:hover .item-image img {
                transform: scale(1.1);
            }

            .checkout-btn {
                width: 100%;
                padding: 1.25rem;
                border: none;
                border-radius: 12px;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                color: white;
                font-weight: 700;
                font-size: 1.1rem;
                cursor: pointer;
                transition: all 0.3s ease;
                margin-bottom: 1rem;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }

            .checkout-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 12px 24px rgba(14, 165, 233, 0.3);
            }

            .clear-cart-btn {
                border-color: #ef4444 !important;
                color: #ef4444 !important;
            }

            .clear-cart-btn:hover {
                background: #ef4444 !important;
                color: white !important;
            }

            .summary-total {
                display: flex;
                justify-content: space-between;
                padding: 1.5rem 0;
                font-size: 1.5rem;
                font-weight: 800;
                color: #111827;
            }

            .summary-total span:last-child {
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
        </style>

        <section class="user-page-container">
            <div class="container">
                <!-- Cart Header -->
                <div class="user-header animate-fadeInUp">
                    <div class="header-content">
                        <div class="header-title">
                            <h1>Shopping Cart</h1>
                            <span class="count-badge" id="cartItemCount">0 Items</span>
                        </div>
                        <a href="/user/dashboard" class="back-btn">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </div>

                <!-- Cart Content -->
                <div id="cartContent">
                    <!-- Cart items will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>

        <script>
            let cartData = null;

            function getCsrfToken() {
                return document.querySelector('meta[name="_csrf"]')?.content ||
                    document.querySelector('input[name="_csrf"]')?.value;
            }

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" 
                       style="color: ${type === 'success' ? '#10b981' : '#ef4444'}; font-size: 1.5rem;"></i>
                    <span>${message}</span>
                `;
                document.body.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 100);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            function setLoading(isLoading) {
                document.getElementById('loadingOverlay').classList.toggle('active', isLoading);
            }

            async function fetchCart() {
                try {
                    setLoading(true);
                    const response = await fetch('/api/cart', {
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    if (!response.ok) throw new Error('Failed to fetch cart');
                    const result = await response.json();
                    cartData = result.data;
                    renderCart();
                } catch (error) {
                    console.error('Error fetching cart:', error);
                    showToast('Failed to load cart', 'error');
                    renderEmptyCart();
                } finally {
                    setLoading(false);
                }
            }

            function renderCart() {
                const container = document.getElementById('cartContent');
                const itemCount = document.getElementById('cartItemCount');

                if (!cartData || !cartData.items || cartData.items.length === 0) {
                    renderEmptyCart();
                    itemCount.textContent = '0 Items';
                    return;
                }

                itemCount.textContent = `${cartData.items.length} Item${cartData.items.length > 1 ? 's' : ''}`;

                container.innerHTML = `
                    <div class="content-grid">
                        <!-- Cart Items -->
                        <div class="items-list">
                            ${cartData.items.map((item, index) => `
                                <div class="user-card cart-item animate-fadeInUp" style="animation-delay: ${index * 0.1}s;">
                                    <div class="card-body d-flex gap-3" style="display: flex; gap: 1.5rem;">
                                        <div class="item-image large">
                                            <img src="${item.productImage || '/images/placeholder.png'}" 
                                                 alt="${item.productName || 'Product'}"
                                                 onerror="this.src='/images/placeholder.png'">
                                        </div>
                                        
                                        <div class="item-details" style="flex: 1;">
                                            <h3 class="item-name">
                                                <a href="/products/${item.productSlug}">${item.productName || 'Product'}</a>
                                            </h3>
                                            <p class="text-muted" style="font-size: 0.9rem; line-height: 1.5;">${item.product?.description || ''}</p>
                                            <div class="item-meta">
                                                ${item.categories && item.categories.length > 0 ? `
                                                    <span class="meta-tag">
                                                        <i class="fas fa-tag"></i>
                                                        ${item.categories.map(cat => cat.title).join(", ")}
                                                    </span>
                                                ` : ''}
                                                ${item.productQuantity > 0 ? `
                                                    <span class="meta-tag in-stock">
                                                        <i class="fas fa-check-circle"></i> In Stock
                                                    </span>
                                                ` : `
                                                    <span class="meta-tag out-of-stock">
                                                        <i class="fas fa-times-circle"></i> Out of Stock
                                                    </span>
                                                `}
                                            </div>
                                        </div>
                                        
                                        <div class="item-pricing" style="display: flex; flex-direction: column; align-items: flex-end; gap: 1rem;">
                                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                                ${item.originalLineTotal && item.originalLineTotal > item.lineTotal ? `
                                                    <span class="text-muted" style="font-size: 1.2rem;">
                                                        <del>$${item.originalLineTotal.toFixed(2)}</del>
                                                    </span>
                                                ` : ''}
                                                <span class="item-total-price">$${item.lineTotal?.toFixed(2) || '0.00'}</span>
                                            </div>
                                            
                                            <div class="quantity-controls">
                                                <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity - 1})"
                                                        ${item.quantity <= 1 ? 'disabled' : ''}>
                                                    <i class="fas fa-minus"></i>
                                                </button>
                                                <span class="quantity-value">${item.quantity}</span>
                                                <button class="quantity-btn" onclick="updateQuantity(${item.id}, ${item.quantity + 1})">
                                                    <i class="fas fa-plus"></i>
                                                </button>
                                            </div>
                                            
                                            <button class="btn btn-danger btn-sm" onclick="removeItem(${item.id})">
                                                <i class="fas fa-trash"></i> Remove
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Cart Summary -->
                        <div class="summary-sidebar">
                            <div class="summary-card">
                                <h2 class="summary-title">
                                    <i class="fas fa-receipt"></i>
                                    Order Summary
                                </h2>
                                
                                <!-- Items Summary -->
                                <div class="summary-row" style="flex-direction: column; align-items: stretch;">
                                    ${cartData.items.map(item => `
                                        <div style="display: flex; justify-content: space-between; padding: 0.5rem 0;">
                                            <div>
                                                <strong>${item.productName}</strong><br>
                                                <small class="text-muted">$${item.price} × ${item.quantity}</small>
                                            </div>
                                            <strong>$${(item.price * item.quantity).toFixed(2)}</strong>
                                        </div>
                                    `).join('')}
                                </div>
                                
                                <!-- Subtotal -->
                                <div class="summary-row">
                                    <span>Subtotal</span>
                                    <span>$${cartData.items.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2)}</span>
                                </div>
                                
                                <!-- Total Discount -->
                                <div class="summary-row discount">
                                    <span>Discount</span>
                                    <span>-$${cartData.items.reduce((sum, item) => sum + ((item.originalLineTotal || item.lineTotal) - item.lineTotal), 0).toFixed(2)}</span>
                                </div>
                                
                                <!-- Shipping -->
                                <div class="summary-row">
                                    <span>Shipping</span>
                                    <span>${cartData.shippingCost > 0 ? `$${cartData.shippingCost.toFixed(2)}` : 'FREE'}</span>
                                </div>
                                
                                <!-- Tax -->
                                <div class="summary-row">
                                    <span>Tax</span>
                                    <span>$${cartData.tax?.toFixed(2) || '0.00'}</span>
                                </div>
                                
                                <!-- Grand Total -->
                                <div class="summary-total">
                                    <span>Total</span>
                                    <span>$${cartData.totalAmount.toFixed(2)}</span>
                                </div>
                                
                                <!-- Actions -->
                                <button class="checkout-btn" onclick="proceedToCheckout()">
                                    <i class="fas fa-lock"></i> Proceed to Checkout
                                </button>
                                <button class="btn btn-secondary btn-block mb-2" onclick="location.href='/'">
                                    <i class="fas fa-shopping-bag"></i> Continue Shopping
                                </button>
                                <button class="btn btn-secondary btn-block clear-cart-btn" onclick="clearCart()">
                                    <i class="fas fa-trash-alt"></i> Clear Cart
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderEmptyCart() {
                document.getElementById('cartContent').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-cart empty-icon"></i>
                        <h2>Your cart is empty</h2>
                        <p>Looks like you haven't added anything to your cart yet</p>
                        <a href="/" class="btn btn-primary btn-lg">
                            <i class="fas fa-shopping-bag"></i> Start Shopping
                        </a>
                    </div>
                `;
            }

            async function updateQuantity(itemId, newQuantity) {
                if (newQuantity < 1) {
                    removeItem(itemId);
                    return;
                }
                try {
                    setLoading(true);
                    const response = await fetch(`/api/cart/items/${itemId}?quantity=${newQuantity}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    if (!response.ok) throw new Error('Failed to update quantity');
                    const result = await response.json();
                    cartData = result.data;
                    renderCart();
                    showToast('Cart updated successfully');
                } catch (error) {
                    console.error('Update error:', error);
                    showToast('Failed to update cart', 'error');
                } finally {
                    setLoading(false);
                }
            }

            async function removeItem(itemId) {
                if (!confirm('Remove this item from cart?')) return;
                try {
                    setLoading(true);
                    const response = await fetch(`/api/cart/items/${itemId}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    if (!response.ok) throw new Error('Failed to remove item');
                    const result = await response.json();
                    cartData = result.data;
                    renderCart();
                    showToast('Item removed from cart');
                } catch (error) {
                    console.error('Remove error:', error);
                    showToast('Failed to remove item', 'error');
                } finally {
                    setLoading(false);
                }
            }

            async function clearCart() {
                if (!confirm('Are you sure you want to clear your entire cart?')) return;
                try {
                    setLoading(true);
                    const response = await fetch('/api/cart/clear', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    if (!response.ok) throw new Error('Failed to clear cart');
                    cartData = null;
                    renderEmptyCart();
                    document.getElementById('cartItemCount').textContent = '0 Items';
                    showToast('Cart cleared successfully');
                } catch (error) {
                    console.error('Clear error:', error);
                    showToast('Failed to clear cart', 'error');
                } finally {
                    setLoading(false);
                }
            }

            function proceedToCheckout() {
                if (!cartData || !cartData.items || cartData.items.length === 0) {
                    showToast('Your cart is empty', 'error');
                    return;
                }
                window.location.href = '/user/cart/checkout';
            }

            document.addEventListener('DOMContentLoaded', fetchCart);
        </script>
    </section>
</body>

</html>
