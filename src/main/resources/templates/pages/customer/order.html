<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">

<body>
    <section th:fragment="section">
        <!-- Include shared CSS -->
        <link rel="stylesheet" th:href="@{/web/css/user-pages.css}" />

        <section class="user-page-container">
            <div class="container">
                <!-- Page Header -->
                <div class="user-header animate-fadeInUp">
                    <div class="header-content">
                        <div class="header-title">
                            <h1>My Orders</h1>
                            <span class="count-badge" id="ordersCount">0 Orders</span>
                        </div>
                        <a href="/user/dashboard" class="back-btn">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </div>

                <!-- Filters Bar -->
                <div class="filters-bar animate-fadeInUp" style="animation-delay: 0.1s;">
                    <div class="filter-group">
                        <label class="filter-label">Status:</label>
                        <select class="filter-select" id="statusFilter" onchange="applyFilters()">
                            <option value="">All Orders</option>
                            <option value="PENDING">Pending</option>
                            <option value="PROCESSING">Processing</option>
                            <option value="SHIPPED">Shipped</option>
                            <option value="DELIVERED">Delivered</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Sort By:</label>
                        <select class="filter-select" id="sortFilter" onchange="applyFilters()">
                            <option value="date-desc">Newest First</option>
                            <option value="date-asc">Oldest First</option>
                            <option value="amount-desc">Highest Amount</option>
                            <option value="amount-asc">Lowest Amount</option>
                        </select>
                    </div>
                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" id="searchInput"
                            placeholder="Search by Order ID or Product Name..." oninput="debounceSearch()">
                    </div>
                </div>

                <!-- Orders Content -->
                <div id="ordersContent">
                    <!-- Orders will be loaded here -->
                </div>
            </div>
        </section>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>

        <script>
            let ordersData = [];
            let filteredOrders = [];
            let currentPage = 1;
            const ordersPerPage = 5;
            let searchTimeout = null;

            function debounceSearch() {
                if (searchTimeout) clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => applyFilters(), 600);
            }

            function getCsrfToken() {
                return document.querySelector('meta[name="_csrf"]')?.content ||
                    document.querySelector('input[name="_csrf"]')?.value;
            }

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}" 
                       style="color: ${type === 'success' ? '#10b981' : '#ef4444'}; font-size: 1.5rem;"></i>
                    <span>${message}</span>
                `;
                document.body.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 100);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            function setLoading(isLoading) {
                const overlay = document.getElementById('loadingOverlay');
                overlay.classList.toggle('active', isLoading);
            }

            async function fetchOrders() {
                try {
                    setLoading(true);
                    const response = await fetch('/api/orders', {
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    if (!response.ok) throw new Error('Failed to fetch orders');
                    const result = await response.json();
                    ordersData = result.data || [];
                    filteredOrders = [...ordersData];
                    applyFilters();
                } catch (error) {
                    console.error('Error fetching orders:', error);
                    showToast('Failed to load orders', 'error');
                    renderEmptyOrders();
                } finally {
                    setLoading(false);
                }
            }

            function clearFilters() {
                document.getElementById('statusFilter').value = '';
                document.getElementById('sortFilter').value = 'date-desc';
                document.getElementById('searchInput').value = '';
                applyFilters();
            }

            function applyFilters() {
                const statusFilter = document.getElementById('statusFilter').value;
                const sortFilter = document.getElementById('sortFilter').value;
                const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

                filteredOrders = ordersData.filter(order => {
                    const matchesStatus = !statusFilter || order.status === statusFilter;
                    const matchesSearch = !searchQuery ||
                        (order.orderNumber?.toLowerCase().includes(searchQuery)) ||
                        (order.orderItems?.some(item => item.productName?.toLowerCase().includes(searchQuery)));
                    return matchesStatus && matchesSearch;
                });

                filteredOrders.sort((a, b) => {
                    switch (sortFilter) {
                        case 'date-desc': return new Date(b.orderDate) - new Date(a.orderDate);
                        case 'date-asc': return new Date(a.orderDate) - new Date(b.orderDate);
                        case 'amount-desc': return (b.totalAmount || 0) - (a.totalAmount || 0);
                        case 'amount-asc': return (a.totalAmount || 0) - (b.totalAmount || 0);
                        default: return 0;
                    }
                });

                currentPage = 1;
                renderOrders();
            }

            function getStatusClass(status) {
                const statusMap = {
                    'PENDING': 'status-pending',
                    'PROCESSING': 'status-processing',
                    'SHIPPED': 'status-shipped',
                    'DELIVERED': 'status-delivered',
                    'CANCELLED': 'status-cancelled'
                };
                return statusMap[status] || 'status-pending';
            }

            function formatDate(dateString) {
                if (!dateString) return 'N/A';
                return new Date(dateString).toLocaleDateString('en-US', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
            }

            function renderOrders() {
                const container = document.getElementById('ordersContent');
                const ordersCount = document.getElementById('ordersCount');

                if (!ordersData || ordersData.length === 0) {
                    ordersCount.textContent = '0 Orders';
                    renderEmptyOrders();
                    return;
                }

                if (!filteredOrders || filteredOrders.length === 0) {
                    ordersCount.textContent = '0 Orders';
                    renderNoFilterResults();
                    return;
                }

                ordersCount.textContent = `${filteredOrders.length} Order${filteredOrders.length > 1 ? 's' : ''}`;

                const startIndex = (currentPage - 1) * ordersPerPage;
                const paginatedOrders = filteredOrders.slice(startIndex, startIndex + ordersPerPage);
                const totalPages = Math.ceil(filteredOrders.length / ordersPerPage);

                container.innerHTML = `
                    <div class="items-list">
                        ${paginatedOrders.map((order, index) => `
                            <div class="user-card hoverable animate-fadeInUp" style="animation-delay: ${index * 0.1}s;">
                                <div class="card-header">
                                    <div class="info-grid">
                                        <div class="info-item">
                                            <span class="info-label">Order ID</span>
                                            <span class="info-value highlight">#${order.orderNumber || order.id}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">Date</span>
                                            <span class="info-value">${formatDate(order.orderDate)}</span>
                                        </div>
                                        <div class="info-item">
                                            <span class="info-label">Items</span>
                                            <span class="info-value">${order.orderItems?.length || 0} Item(s)</span>
                                        </div>
                                    </div>
                                    <span class="status-badge ${getStatusClass(order.status)}">
                                        ${order.status || 'PENDING'}
                                    </span>
                                </div>

                                <div class="card-body">
                                    <div class="items-list">
                                        ${order.orderItems?.length > 0 ?
                        order.orderItems.map(item => `
                                                <div class="item-card no-hover">
                                                    <div class="item-image small">
                                                        <img src="${item.productImage || '/images/placeholder.png'}" 
                                                             alt="${item.productName || 'Product'}"
                                                             onerror="this.src='/images/placeholder.png'">
                                                    </div>
                                                    <div class="item-details">
                                                        <div class="item-name">${item.productName || 'Product'}</div>
                                                        <div class="item-meta">
                                                            <span><i class="fas fa-box"></i> Qty: ${item.quantity || 1}</span>
                                                            <span><i class="fas fa-tag"></i> $${(item.unitPrice || 0).toFixed(2)}</span>
                                                        </div>
                                                    </div>
                                                    <div class="item-pricing">
                                                        <div class="item-total-price">$${((item.unitPrice || 0) * (item.quantity || 1)).toFixed(2)}</div>
                                                    </div>
                                                </div>
                                            `).join('')
                        : '<p class="text-muted">No items available</p>'
                    }
                                    </div>
                                </div>

                                <div class="card-footer">
                                    <div class="total-display">
                                        <span class="total-label">Total Amount</span>
                                        <span class="total-amount">$${(order.totalAmount || 0).toFixed(2)}</span>
                                    </div>
                                    <div class="action-buttons horizontal">
                                        <button class="btn btn-primary btn-sm" onclick="viewOrderDetails(${order.id})">
                                            <i class="fas fa-eye"></i> View Details
                                        </button>
                                        ${order.status === 'DELIVERED' ? `
                                            <button class="btn btn-secondary btn-sm" onclick="reorder(${order.id})">
                                                <i class="fas fa-redo"></i> Reorder
                                            </button>
                                        ` : ''}
                                        ${order.status === 'PENDING' || order.status === 'PROCESSING' ? `
                                            <button class="btn btn-danger btn-sm" onclick="cancelOrder(${order.id})">
                                                <i class="fas fa-times"></i> Cancel
                                            </button>
                                        ` : ''}
                                        <button class="btn btn-secondary btn-sm" onclick="downloadInvoice(${order.id})">
                                            <i class="fas fa-download"></i> Invoice
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    ${totalPages > 1 ? `
                        <div class="pagination">
                            <button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
                                <i class="fas fa-chevron-left"></i>
                            </button>
                            ${Array.from({ length: totalPages }, (_, i) => i + 1).map(page => `
                                <button class="page-btn ${page === currentPage ? 'active' : ''}" onclick="changePage(${page})">
                                    ${page}
                                </button>
                            `).join('')}
                            <button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
                                <i class="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    ` : ''}
                `;
            }

            function renderEmptyOrders() {
                document.getElementById('ordersContent').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-shopping-bag empty-icon"></i>
                        <h2>No orders yet</h2>
                        <p>Start shopping and your orders will appear here</p>
                        <a href="/" class="btn btn-primary btn-lg">
                            <i class="fas fa-shopping-cart"></i> Start Shopping
                        </a>
                    </div>
                `;
            }

            function renderNoFilterResults() {
                document.getElementById('ordersContent').innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-filter filter-icon"></i>
                        <h3>No orders match your filters</h3>
                        <p>Try adjusting your search or filter criteria</p>
                        <button class="btn btn-outline-primary" onclick="clearFilters()">
                            <i class="fas fa-times"></i> Clear Filters
                        </button>
                    </div>
                `;
            }

            function changePage(page) {
                currentPage = page;
                renderOrders();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function viewOrderDetails(orderId) {
                window.location.href = `/user/orders/${orderId}`;
            }

            async function reorder(orderId) {
                if (!confirm('Add all items from this order to your cart?')) return;
                try {
                    setLoading(true);
                    const response = await fetch(`/api/orders/${orderId}/reorder`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    if (!response.ok) throw new Error('Failed to reorder');
                    showToast('Items added to cart successfully');
                    setTimeout(() => window.location.href = '/user/cart', 1500);
                } catch (error) {
                    console.error('Reorder error:', error);
                    showToast('Failed to reorder items', 'error');
                } finally {
                    setLoading(false);
                }
            }

            async function cancelOrder(orderId) {
                if (!confirm('Are you sure you want to cancel this order?')) return;
                try {
                    setLoading(true);
                    const response = await fetch(`/api/orders/${orderId}/cancel`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': getCsrfToken()
                        }
                    });
                    const result = await response.json();
                    if (response.ok && result.success) {
                        showToast('Order cancelled successfully');
                        await fetchOrders();
                    } else {
                        showToast(result.message || 'Failed to cancel order', 'error');
                    }
                } catch (error) {
                    console.error('Cancel order error:', error);
                    showToast('Failed to cancel order', 'error');
                } finally {
                    setLoading(false);
                }
            }

            function downloadInvoice(orderId) {
                showToast('Invoice download feature coming soon!', 'error');
            }

            document.addEventListener("DOMContentLoaded", fetchOrders);
        </script>
    </section>
</body>

</html>
