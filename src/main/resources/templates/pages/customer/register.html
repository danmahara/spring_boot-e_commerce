<!DOCTYPE html>
<div lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">

    <div th:fragment="section">
        <style>
            .auth-section {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                padding: 2rem;
            }

            .auth-card {
                background: rgba(255, 255, 255, 0.95);
                padding: 3rem;
                border-radius: 22px;
                width: 100%;
                max-width: 460px;
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
                animation: fadeUp 0.6s ease;
            }

            .auth-title {
                font-size: 2rem;
                font-weight: 800;
                text-align: center;
                margin-bottom: 0.5rem;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .auth-subtitle {
                text-align: center;
                color: #6b7280;
                margin-bottom: 2rem;
            }

            .form-group {
                margin-bottom: 1.25rem;
            }

            .form-group label {
                display: block;
                font-weight: 600;
                margin-bottom: 0.5rem;
                color: #374151;
            }

            .form-group input {
                width: 100%;
                padding: 0.9rem 1rem;
                border-radius: 14px;
                border: 1px solid #e5e7eb;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .form-group input:focus {
                outline: none;
                border-color: #0ea5e9;
                box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
            }

            .auth-btn {
                width: 100%;
                padding: 0.95rem;
                border-radius: 16px;
                border: none;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                color: white;
                font-size: 1.1rem;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .auth-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 15px 30px rgba(14, 165, 233, 0.4);
            }

            .auth-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

            .auth-footer {
                text-align: center;
                margin-top: 1.5rem;
                color: #6b7280;
            }

            .auth-footer a {
                color: #8b5cf6;
                font-weight: 700;
                text-decoration: none;
            }

            .auth-footer a:hover {
                text-decoration: underline;
            }

            .error-message {
                background: #fee;
                border: 1px solid #fcc;
                color: #c33;
                padding: 0.75rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                font-size: 0.9rem;
            }

            .success-message {
                background: #efe;
                border: 1px solid #cfc;
                color: #3c3;
                padding: 0.75rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                font-size: 0.9rem;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>

        <section class="hero-section">
            <div class="hero-slide active">
                <img th:src="${page.coverImage}" th:alt="${page.title}" class="hero-image">
                <div class="hero-content">
                    <h1 th:text="${page.title}"></h1>
                    <p th:utext="${page.description}"></p>
                </div>
            </div>
        </section>

        <section class="auth-section">
            <div class="auth-card">
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Join us and start shopping today</p>

                <!-- Message container -->
                <div id="messageContainer"></div>

                <form id="registerForm" method="post" action="/register">
                    <!-- CSRF Token (Thymeleaf will inject this) -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="fullName" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" name="confirmPassword" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="auth-btn" id="submitBtn">Create Account</button>

                    <p class="auth-footer">
                        Already have an account?
                        <a href="/login">Login</a>
                    </p>
                </form>
            </div>
        </section>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const form = document.getElementById('registerForm');
                const password = document.querySelector('input[name="password"]');
                const confirmPassword = document.querySelector('input[name="confirmPassword"]');
                const submitBtn = document.getElementById('submitBtn');
                const messageContainer = document.getElementById('messageContainer');

                // Get CSRF token from form
                const csrfToken = document.querySelector('input[name="_csrf"]').value;

                // Show message function
                function showMessage(message, isError = false) {
                    messageContainer.innerHTML = `
                        <div class="${isError ? 'error-message' : 'success-message'}">
                            ${message}
                        </div>
                    `;
                    // Auto-hide after 5 seconds
                    setTimeout(() => {
                        messageContainer.innerHTML = '';
                    }, 5000);
                }

                // Password validation
                function validatePasswords() {
                    if (password.value !== confirmPassword.value) {
                        confirmPassword.setCustomValidity("Passwords don't match");
                        return false;
                    } else {
                        confirmPassword.setCustomValidity('');
                        return true;
                    }
                }

                confirmPassword.addEventListener('input', validatePasswords);
                password.addEventListener('input', validatePasswords);

                // Form submission
                form.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    if (!validatePasswords()) {
                        showMessage("Passwords don't match!", true);
                        return;
                    }

                    const formData = {
                        fullName: form.fullName.value,
                        email: form.email.value,
                        password: form.password.value,
                        confirmPassword: form.confirmPassword.value
                    };

                    // Disable button during submission
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Creating Account...';

                    try {
                        const response = await fetch('/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-TOKEN': csrfToken  // Include CSRF token
                            },
                            body: JSON.stringify(formData)
                        });

                        const result = await response.json();

                        if (response.ok && result.success) {
                            showMessage('Account created successfully! Redirecting to login...');
                            setTimeout(() => {
                                window.location.href = '/login';
                            }, 1500);
                        } else {
                            showMessage(result.message || 'Registration failed. Please try again.', true);
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Create Account';
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        showMessage('An error occurred. Please try again.', true);
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Create Account';
                    }
                });
            });
        </script>
    </div>
</div>
