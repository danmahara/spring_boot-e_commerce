<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">

<body>
    <section th:fragment="section">
        <!-- Include shared CSS -->
        <link rel="stylesheet" th:href="@{/web/css/user-pages.css}" />

        <style>
            /* Wishlist Specific Styles */
            .wishlist-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 1.5rem;
                margin-bottom: 2rem;
            }

            .wishlist-card {
                background: white;
                border-radius: 16px;
                overflow: hidden;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
                transition: all 0.3s ease;
                position: relative;
            }

            .wishlist-card:hover {
                transform: translateY(-8px);
                box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
            }

            .wishlist-image-container {
                position: relative;
                width: 100%;
                height: 280px;
                overflow: hidden;
                background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            }

            .wishlist-image {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.4s ease;
            }

            .wishlist-card:hover .wishlist-image {
                transform: scale(1.08);
            }

            .wishlist-badge {
                position: absolute;
                top: 1rem;
                left: 1rem;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                color: white;
                padding: 0.5rem 1rem;
                border-radius: 20px;
                font-size: 0.75rem;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
            }

            .remove-wishlist-btn {
                position: absolute;
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                background: white;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
                z-index: 2;
            }

            .remove-wishlist-btn i {
                color: #ef4444;
                font-size: 1.1rem;
                transition: transform 0.3s ease;
            }

            .remove-wishlist-btn:hover {
                background: #ef4444;
                transform: scale(1.1);
            }

            .remove-wishlist-btn:hover i {
                color: white;
                transform: rotate(90deg);
            }

            .wishlist-content {
                padding: 1.5rem;
            }

            .wishlist-category {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                color: #0ea5e9;
                font-weight: 700;
                margin-bottom: 0.5rem;
            }

            .wishlist-title {
                font-size: 1.1rem;
                font-weight: 700;
                color: #111827;
                margin-bottom: 0.75rem;
                line-height: 1.4;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .wishlist-title a {
                color: inherit;
                text-decoration: none;
                transition: color 0.2s ease;
            }

            .wishlist-title a:hover {
                color: #0ea5e9;
            }

            .wishlist-meta {
                display: flex;
                gap: 1rem;
                margin-bottom: 1rem;
                font-size: 0.85rem;
                color: #6b7280;
            }

            .wishlist-meta span {
                display: flex;
                align-items: center;
                gap: 0.35rem;
            }

            .wishlist-price-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 1rem;
            }

            .wishlist-price {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }

            .current-price {
                font-size: 1.5rem;
                font-weight: 800;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .original-price {
                font-size: 0.9rem;
                color: #9ca3af;
                text-decoration: line-through;
            }

            .discount-badge {
                background: linear-gradient(135deg, #10b981, #059669);
                color: white;
                padding: 0.4rem 0.8rem;
                border-radius: 8px;
                font-size: 0.8rem;
                font-weight: 700;
            }

            .wishlist-stock {
                display: inline-flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.4rem 0.8rem;
                border-radius: 8px;
                font-size: 0.8rem;
                font-weight: 600;
                margin-bottom: 1rem;
            }

            .wishlist-stock.in-stock {
                background: #d1fae5;
                color: #10b981;
            }

            .wishlist-stock.out-of-stock {
                background: #fee2e2;
                color: #ef4444;
            }

            .wishlist-actions {
                display: flex;
                gap: 0.75rem;
            }

            .add-to-cart-btn {
                flex: 1;
                padding: 0.75rem;
                border: none;
                border-radius: 10px;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                color: white;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
            }

            .add-to-cart-btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
            }

            .add-to-cart-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .view-details-btn {
                padding: 0.75rem 1.25rem;
                border: 2px solid #e5e7eb;
                border-radius: 10px;
                background: white;
                color: #6b7280;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .view-details-btn:hover {
                border-color: #0ea5e9;
                color: #0ea5e9;
            }

            .added-date {
                font-size: 0.75rem;
                color: #9ca3af;
                text-align: center;
                padding-top: 1rem;
                border-top: 1px solid #e5e7eb;
                margin-top: 1rem;
            }

            .wishlist-empty-actions {
                display: flex;
                gap: 1rem;
                justify-content: center;
                flex-wrap: wrap;
            }

            .filter-toggle {
                display: flex;
                gap: 0.5rem;
                background: white;
                padding: 0.5rem;
                border-radius: 12px;
                border: 2px solid #e5e7eb;
            }

            .filter-toggle-btn {
                padding: 0.6rem 1.2rem;
                border: none;
                border-radius: 8px;
                background: transparent;
                color: #6b7280;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .filter-toggle-btn.active {
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                color: white;
            }

            .wishlist-stats {
                background: white;
                padding: 1.5rem;
                border-radius: 16px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
                margin-bottom: 2rem;
                display: flex;
                gap: 2rem;
                flex-wrap: wrap;
                justify-content: space-around;
            }

            .stat-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }

            .stat-value {
                font-size: 2rem;
                font-weight: 800;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }

            .stat-label {
                font-size: 0.85rem;
                color: #6b7280;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            @media (max-width: 768px) {
                .wishlist-grid {
                    grid-template-columns: 1fr;
                }

                .wishlist-actions {
                    flex-direction: column;
                }

                .wishlist-stats {
                    gap: 1rem;
                }

                .stat-item {
                    flex: 1;
                    min-width: 120px;
                }
            }

            @media (max-width: 480px) {
                .wishlist-image-container {
                    height: 220px;
                }

                .wishlist-price-row {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 0.75rem;
                }
            }
        </style>

        <section class="user-page-container">
            <div class="container">
                <!-- Wishlist Header -->
                <div class="user-header animate-fadeInUp">
                    <div class="header-content">
                        <div class="header-title">
                            <h1><i class="fas fa-heart"></i> My Wishlist</h1>
                            <span class="count-badge" id="cartItemCount">0 Items</span>
                        </div>
                        <a href="/user/dashboard" class="back-btn">
                            <i class="fas fa-arrow-left"></i> Back to Dashboard
                        </a>
                    </div>
                </div>

                <!-- Wishlist Stats -->
                <div class="wishlist-stats animate-fadeInUp">
                    <div class="stat-item">
                        <div class="stat-value" id="totalItems">0</div>
                        <div class="stat-label">Total Items</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="inStockItems">0</div>
                        <div class="stat-label">In Stock</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalValue">$0</div>
                        <div class="stat-label">Total Value</div>
                    </div>
                </div>

                <!-- Filters Bar -->
                <div class="filters-bar animate-fadeInUp">
                    <div class="filter-group">
                        <label class="filter-label">Filter:</label>
                        <div class="filter-toggle">
                            <button class="filter-toggle-btn active" data-filter="all">
                                All Items
                            </button>
                            <button class="filter-toggle-btn" data-filter="in-stock">
                                In Stock
                            </button>
                            <button class="filter-toggle-btn" data-filter="out-of-stock">
                                Out of Stock
                            </button>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Sort By:</label>
                        <select class="filter-select" id="sortSelect">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="price-low">Price: Low to High</option>
                            <option value="price-high">Price: High to Low</option>
                            <option value="name">Name: A to Z</option>
                        </select>
                    </div>

                    <div class="search-box">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" placeholder="Search wishlist items..." id="searchInput">
                    </div>
                </div>

                <p th:text="${products}"></p>
                <!-- Wishlist Content -->
                <div id="wishlistItems">

                    <!-- Wishlist items will be dynamically loaded here -->
                    <!-- Example structure: -->

                    <div class="wishlist-grid" th:if="${#lists.size(wishlists)>0}">

                        <div class="wishlist-card" th:each="item : ${wishlists}">

                            <div class="wishlist-image-container">
                                <img th:src="${item.product.getFeatureImage()}" th:alt="${item.product.name}"
                                    class="wishlist-image">
                                <span class="wishlist-badge">NEW</span>
                                <button class="remove-wishlist-btn" title="Remove from wishlist">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                            <div class="wishlist-content">
                                <div class="wishlist-category">
                                    <span th:each="cat, stat : ${item.product.categories}">
                                        <span th:text="${cat.title}"></span>
                                        <span th:if="${!stat.last}">, </span>
                                    </span>
                                </div>


                                <h3 class="wishlist-title">
                                    <a th:href="@{/products/{slug}(slug=${item.product.slug})}"
                                        th:text="${item.product.name}">Product name</a>
                                </h3>

                                <div class="wishlist-price-row" th:if="${item.product.discountType!=null}">
                                    <div class="wishlist-price">

                                        <div class="current-price" th:text="${#numbers.formatDecimal(item.product.discountType=='fixed'  
                                            ? (item.product.price - item.product.discountPrice)
                                            : (item.product.price - (item.product.price * item.product.discountPercent) / 100),
                                            1, 'COMMA', 2, 'POINT'
                                        )}">
                                        </div>

                                        <div class="original-price" th:text="${item.product.price}">$199.99</div>
                                    </div>

                                    <div class="discount-badge"
                                        th:text="${item.product.discountType=='fixed'? 'Save: '+item.product.discountPrice: item.product.discountPercent+'% OFF' }">
                                        35%
                                        OFF
                                    </div>
                                </div>

                                <div class="wishlist-price-row" th:if="${item.product.discountType==null}">
                                    <div class="wishlist-price">
                                        <div class="current-price" th:text="${item.product.price}">$129.99</div>
                                    </div>
                                </div>


                                <div th:if="${item.product.quantity > 0}" class="wishlist-stock in-stock">
                                    <i class="fas fa-check-circle"></i> In Stock
                                </div>
                                <div th:if="${item.product.quantity == 0}" class="wishlist-stock out-of-stock">
                                    <i class="fas fa-times-circle"></i> Out of Stock
                                </div>


                                <div class="wishlist-actions">
                                    <button class="add-to-cart-btn">
                                        <i class="fas fa-shopping-cart"></i> Add to Cart
                                    </button>
                                    <a th:href="@{/products/{slug}(slug=${item.product.slug})}" class="view-details-btn"
                                        title="View Details">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </div>
                                <div class="added-date">
                                    <i class="fas fa-clock"></i> Added on
                                    <span th:text="${#temporals.format(item.addedDate,'MMM dd, yyyy')}"></span>

                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Empty State (Show when no items) -->
                <div class="empty-state" id="emptyState" style="display: none;">
                    <i class="fas fa-heart-broken empty-icon"></i>
                    <h2>Your Wishlist is Empty</h2>
                    <p>Save your favorite items to buy them later!</p>
                    <div class="wishlist-empty-actions">
                        <a href="/products" class="btn btn-primary btn-lg">
                            <i class="fas fa-shopping-bag"></i> Start Shopping
                        </a>
                        <a href="/categories" class="btn btn-secondary btn-lg">
                            <i class="fas fa-th-large"></i> Browse Categories
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
        </div>

    </section>
</body>

</html>
