<!DOCTYPE html>
<div lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">
    <div th:fragment="section">
        <style>
            .login-section {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                padding: 2rem;
            }

            .login-card {
                background: rgba(255, 255, 255, 0.95);
                padding: 3rem;
                border-radius: 20px;
                width: 100%;
                max-width: 420px;
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
                animation: fadeInUp 0.6s ease;
            }

            .login-title {
                font-size: 2rem;
                font-weight: 800;
                text-align: center;
                margin-bottom: 0.5rem;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .login-subtitle {
                text-align: center;
                color: #6b7280;
                margin-bottom: 2rem;
            }

            .form-group {
                margin-bottom: 1.25rem;
            }

            .form-group label {
                display: block;
                font-weight: 600;
                margin-bottom: 0.5rem;
                color: #374151;
            }

            .form-group input {
                width: 100%;
                padding: 0.85rem 1rem;
                border-radius: 12px;
                border: 1px solid #e5e7eb;
                font-size: 1rem;
                transition: all 0.3s ease;
            }

            .form-group input:focus {
                outline: none;
                border-color: #0ea5e9;
                box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
            }

            .form-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }

            .remember-me {
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }

            .forgot-link {
                color: #0ea5e9;
                font-weight: 600;
                text-decoration: none;
            }

            .forgot-link:hover {
                text-decoration: underline;
            }

            .form-submit-btn {
                width: 100%;
                padding: 0.9rem;
                border-radius: 14px;
                border: none;
                background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
                color: white;
                font-size: 1.1rem;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .form-submit-btn:hover:not(:disabled) {
                transform: translateY(-2px);
                box-shadow: 0 15px 30px rgba(14, 165, 233, 0.4);
            }

            .form-submit-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
            }

            .register-text {
                text-align: center;
                margin-top: 1.5rem;
                color: #6b7280;
            }

            .register-text a {
                color: #8b5cf6;
                font-weight: 700;
                text-decoration: none;
            }

            .register-text a:hover {
                text-decoration: underline;
            }

            .error-message {
                background: #fee;
                border: 1px solid #fcc;
                color: #c33;
                padding: 0.75rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                font-size: 0.9rem;
            }

            .success-message {
                background: #efe;
                border: 1px solid #cfc;
                color: #3c3;
                padding: 0.75rem;
                border-radius: 8px;
                margin-bottom: 1rem;
                font-size: 0.9rem;
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>

        <section class="hero-section">
            <div class="hero-slide active">
                <img th:src="${page.coverImage}" th:alt="${page.title}" class="hero-image">
                <div class="hero-content">
                    <h1 th:text="${page.title}"></h1>
                    <p th:utext="${page.description}"></p>
                </div>
            </div>
        </section>

        <section class="login-section">
            <div class="login-card">
                <h2 class="login-title">Customer Login</h2>
                <p class="login-subtitle">Welcome back! Please login to your account</p>

                <!-- Message container -->
                <div id="messageContainer"></div>

                <form id="loginForm">
                    <!-- CSRF Token -->
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="you@example.com">
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••">
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="rememberMe">
                            Remember me
                        </label>
                        <a href="/forgot-password" class="forgot-link">Forgot password?</a>
                    </div>

                    <button type="submit" class="form-submit-btn" id="loginBtn">Login</button>

                    <p class="register-text">
                        Don't have an account?
                        <a href="/register">Create one</a>
                    </p>
                </form>
            </div>
        </section>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const form = document.getElementById('loginForm');
                const loginBtn = document.getElementById('loginBtn');
                const messageContainer = document.getElementById('messageContainer');

                // Get CSRF from meta tags
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-CSRF-TOKEN';

                // Show message function
                function showMessage(message, isError = false) {
                    messageContainer.innerHTML = `
                        <div class="${isError ? 'error-message' : 'success-message'}">
                            ${message}
                        </div>
                    `;
                    setTimeout(() => {
                        messageContainer.innerHTML = '';
                    }, 5000);
                }

                form.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const formData = new FormData(form);
                    const data = {
                        email: formData.get('email'),
                        password: formData.get('password')
                    };

                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Logging in...';

                    try {
                        const headers = {
                            'Content-Type': 'application/json'
                        };

                        // Only add CSRF header if token exists
                        if (csrfToken) {
                            headers[csrfHeader] = csrfToken;
                        }

                        const response = await fetch('/login', {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(data)
                        });

                        const result = await response.json();

                        if (response.ok && result.success) {
                            showMessage('Login successful! Redirecting...');
                            setTimeout(() => {
                                window.location.href = result.redirectUrl || '/user/dashboard';
                            }, 1000);
                        } else {
                            showMessage(result.message || 'Login failed. Please try again.', true);
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'Login';
                        }
                    } catch (error) {
                        console.error('Error during login:', error);
                        showMessage('An error occurred. Please try again later.', true);
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    }
                });
            });
        </script>

    </div>
</div>
