<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">


<div th:fragment="section">
    <style>
        .hero-section {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            /* background: linear-gradient(135deg, #0ea5e9 0%, #8b5cf6 100%); */
        }

        /* Slide */
        .hero-slide {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .hero-slide.active {
            z-index: 1;
        }

        /* Hero Image */
        .hero-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* Overlay (optional) */
        .hero-slide::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.5), rgba(139, 92, 246, 0.5));
            z-index: 2;
        }

        /* Content */
        .hero-content {
            position: relative;
            z-index: 3;
            text-align: center;
            color: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero-content h1 {
            font-size: clamp(2.5rem, 6vw, 5rem);
            margin-bottom: 1.5rem;
            font-weight: 800;
            line-height: 1.1;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .hero-content p {
            font-size: clamp(1.125rem, 2vw, 1.5rem);
            margin-bottom: 2rem;
            opacity: 0.95;
            line-height: 1.6;
        }
    </style>

    <section class="hero-section">
        <div class="hero-slide active">

            <!-- Image instead of background -->
            <img src="/images/default-hero.jpg" alt="Hero Image" class="hero-image">

            <div class="hero-content ">
                <h1>About Us</h1>
                <p>Learn about our mission and values.</p>
            </div>
        </div>
    </section>




</div>

</html>
