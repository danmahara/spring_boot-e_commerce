<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="layouts/base :: layout(~{::section})">

<div th:fragment="section">

    <section class="hero-section">
        <div class="hero-slide active">
            <!-- Image instead of background -->
            <img th:src="${page.coverImage}" th:alt="${page.title}" class="hero-image">

            <div class="hero-content ">
                <h1 th:text="${page.title}"></h1>
                <p th:text="${page.description}"></p>
            </div>
        </div>
    </section>


</div>

</html>
