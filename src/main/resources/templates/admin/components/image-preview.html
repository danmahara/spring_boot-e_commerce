<!-- Enhanced Image Preview Fragment -->
<div th:fragment="preview(previewId, nameId, dbImagePath)">

    <span th:id="${nameId}" class="text-gray-500 text-sm mt-1 block hidden"></span>

    <img th:id="${previewId}" th:src="${dbImagePath != null && dbImagePath != ''} ? @{${dbImagePath}} : ''"
        alt="Preview" class="w-32 h-32 object-cover border border-gray-300 rounded-lg mt-2"
        th:classappend="${dbImagePath != null && dbImagePath != ''} ? '' : 'hidden'">

    <script>
        function updateFilePreview(input, imgId, spanId) {
            const file = input.files[0];
            const preview = document.getElementById(imgId);
            const nameSpan = document.getElementById(spanId);

            if (file) {
                nameSpan.textContent = file.name;
                nameSpan.classList.remove('hidden');
                preview.src = URL.createObjectURL(file);
                preview.classList.remove('hidden');
            } else {
                nameSpan.textContent = "";
                nameSpan.classList.add('hidden');
                // Don't hide preview if there's a database image
                const dbSrc = preview.getAttribute('data-db-src');
                if (!dbSrc) {
                    preview.src = "";
                    preview.classList.add('hidden');
                }
            }
        }
    </script>

</div>
