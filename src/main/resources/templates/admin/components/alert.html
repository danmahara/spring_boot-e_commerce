<div th:fragment="custom-alert">

    <style>
        .demo-container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .demo-container h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .demo-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .demo-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .demo-buttons button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .demo-buttons .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .demo-buttons .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .demo-buttons .btn-error {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .demo-buttons .btn-error:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(239, 68, 68, 0.3);
        }

        /* Flash Notifications Container */
        .flash-notifications-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .flash-notifications-container .flash-notification {
            pointer-events: auto;
        }

        /* Flash Notification Styles */
        .flash-notification {
            padding: 0;
            border-radius: 12px;
            opacity: 1;
            transform: translateX(0) scale(1);
            animation: slideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 320px;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px) scale(0.8);
                opacity: 0;
            }

            to {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        .flash-notification.hide {
            animation: slideOut 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideOut {
            from {
                transform: translateX(0) scale(1);
                opacity: 1;
            }

            to {
                transform: translateX(400px) scale(0.8);
                opacity: 0;
            }
        }

        .flash-content {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px 20px;
            position: relative;
        }

        .flash-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-top: 2px;
        }

        .flash-text-wrapper {
            flex: 1;
            text-align: left;
        }

        .flash-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .flash-text {
            font-size: 13px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .flash-close {
            flex-shrink: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.2s;
            font-size: 18px;
            line-height: 1;
        }

        .flash-close:hover {
            opacity: 1;
        }

        .flash-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: currentColor;
            opacity: 0.3;
        }

        /* Success Variant */
        .flash-notification.flash-success {
            background: linear-gradient(135deg, #ecfdf5 0%, #f0fdf4 100%);
            border: 1px solid #d1fae5;
            color: #047857;
        }

        .flash-notification.flash-success .flash-icon {
            color: #10b981;
        }

        .flash-notification.flash-success .flash-title {
            color: #047857;
        }

        .flash-notification.flash-success .flash-text {
            color: #059669;
        }

        .flash-notification.flash-success .flash-close {
            color: #047857;
        }

        .flash-notification.flash-success .flash-progress {
            animation: progressBar 3.5s linear;
        }

        /* Error Variant */
        .flash-notification.flash-error {
            background: linear-gradient(135deg, #fef2f2 0%, #fef5f5 100%);
            border: 1px solid #fee2e2;
            color: #991b1b;
        }

        .flash-notification.flash-error .flash-icon {
            color: #ef4444;
        }

        .flash-notification.flash-error .flash-title {
            color: #991b1b;
        }

        .flash-notification.flash-error .flash-text {
            color: #dc2626;
        }

        .flash-notification.flash-error .flash-close {
            color: #991b1b;
        }

        .flash-notification.flash-error .flash-progress {
            animation: progressBar 3.5s linear;
        }

        /* Info Variant */
        .flash-notification.flash-info {
            background: linear-gradient(135deg, #eff6ff 0%, #f0f9ff 100%);
            border: 1px solid #bfdbfe;
            color: #1e40af;
        }

        .flash-notification.flash-info .flash-icon {
            color: #3b82f6;
        }

        .flash-notification.flash-info .flash-title {
            color: #1e40af;
        }

        .flash-notification.flash-info .flash-text {
            color: #1d4ed8;
        }

        .flash-notification.flash-info .flash-close {
            color: #1e40af;
        }

        .flash-notification.flash-info .flash-progress {
            animation: progressBar 3.5s linear;
        }

        @keyframes progressBar {
            from {
                width: 100%;
            }

            to {
                width: 0%;
            }
        }

        @media (max-width: 480px) {
            .flash-notifications-container {
                top: 16px;
                right: 16px;
                left: 16px;
            }

            .flash-notification {
                min-width: auto;
                max-width: none;
            }
        }
    </style>

    <div class="flash-notifications-container"></div>


    <script>
        function showFlashMessage(message, type = 'success', title = null) {
            const container = document.querySelector('.flash-notifications-container');

            // Create new alert element
            const flashEl = document.createElement('div');
            flashEl.className = `flash-notification flash-${type}`;

            flashEl.innerHTML = `
                <div class="flash-content">
                    <div class="flash-icon">${getIcon(type)}</div>
                    <div class="flash-text-wrapper">
                        <div class="flash-title">${title || getDefaultTitle(type)}</div>
                        <span class="flash-text">${message}</span>
                    </div>
                    <button class="flash-close" onclick="this.closest('.flash-notification').remove()">✕</button>
                    <div class="flash-progress"></div>
                </div>
            `;

            // Add to container
            container.appendChild(flashEl);

            // Auto-hide after 3.5 seconds with its own independent timer
            const timeoutId = setTimeout(() => {
                flashEl.classList.add('hide');
                setTimeout(() => {
                    flashEl.remove();
                }, 400);
            }, 3500);

            // Store timeout ID for cleanup if needed
            flashEl.timeoutId = timeoutId;
        }

        function getIcon(type) {
            const icons = {
                success: '✓',
                error: '✕',
                info: 'ℹ'
            };
            return icons[type] || '✓';
        }

        function getDefaultTitle(type) {
            const titles = {
                success: 'Success',
                error: 'Error',
                info: 'Info'
            };
            return titles[type] || 'Success';
        }
    </script>
</div>
