<!-- Simpler fragment -->
<div th:fragment="input-field(label, name, placeholder, type, required, value)" class="w-full">
    <label th:for="${name}" class="block mb-1 font-medium text-gray-700">
        <span th:text="${label}">Label</span>
        <span th:if="${required}" class="text-red-500">*</span>
    </label>
    <input th:type="${type} ?: 'text'" th:name="${name}" th:id="${name}" th:value="${value}"
        th:placeholder="${placeholder}"
        class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
</div>
