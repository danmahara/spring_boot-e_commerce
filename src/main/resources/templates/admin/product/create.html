<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="admin/layouts/admin_base :: layout(~{::breadcrumb}, ~{::section})">

<div th:fragment="breadcrumb" th:replace="admin/components/breadcrumb :: breadcrumb-component(
         'Create Products',
         ~{admin/components/breadcrumb-icons :: icon-pages}
        )">
</div>

<div th:fragment="section" class="admin-content">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full">


        <form id="createProductForm" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- <form id="createProductForm" class="grid grid-cols-1 md:grid-cols-2 gap-6"> -->

            <!-- Product Name -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Product Name <span
                        class="text-red-500">*</span></label>
                <input type="text" name="name" placeholder="Enter product name"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Slug -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Slug <span class="text-red-500">*</span></label>
                <input type="text" name="slug" placeholder="Enter product slug"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Thumbnail Image -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Thumbnail Image <span
                        class="text-red-500">*</span></label>
                <div tabindex="0" role="button"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)] hover:bg-gray-50 flex items-center justify-between"
                    onclick="this.querySelector('input').click()"
                    onkeypress="if(event.key === 'Enter' || event.key === ' ') this.querySelector('input').click()">
                    <span id="thumbnail-name" class="text-gray-500">Choose File</span>
                    <input type="file" name="image" accept="image/*" class="hidden"
                        onchange="updateFilePreview(this, 'thumbnail-preview', 'thumbnail-name')">
                </div>
                <div
                    th:replace="admin/components/image-preview :: preview('thumbnail-preview','thumbnail-name', ${page?.featureImage})">
                </div>
            </div>

            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Cover Image <span
                        class="text-red-500">*</span></label>
                <div tabindex="0" role="button"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white cursor-pointer focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)] hover:bg-gray-50 flex items-center justify-between"
                    onclick="this.querySelector('input').click()"
                    onkeypress="if(event.key === 'Enter' || event.key === ' ') this.querySelector('input').click()">
                    <span id="cover-name" class="text-gray-500">Choose File</span>
                    <input type="file" name="coverImage" accept="image/*" class="hidden"
                        onchange="updateFilePreview(this, 'cover-preview', 'cover-name')">
                </div>
                <div
                    th:replace="admin/components/image-preview :: preview('cover-preview','cover-name', ${page?.coverImage})">
                </div>
            </div>

            <!-- Price -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Price <span class="text-red-500">*</span></label>
                <input type="number" name="price" placeholder="Enter price" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Discount Type -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Type</label>
                <select name="discountType"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
                    <option value="">Select Discount Type</option>
                    <option value="percentage">Percentage</option>
                    <option value="fixed">Fixed Amount</option>
                </select>
            </div>

            <!-- Discount Price -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Price</label>
                <input type="number" name="discountPrice" placeholder="Enter discount price" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Discount Percent -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Percent</label>
                <input type="number" name="discountPercent" placeholder="Enter discount percent" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Currency -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Currency <span class="text-red-500">*</span></label>
                <input type="text" name="currency" value="NPR" maxlength="10"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Quantity -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Quantity</label>
                <input type="number" name="quantity" placeholder="Enter quantity" min="0"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- SKU -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">SKU</label>
                <input type="text" name="sku" placeholder="Enter SKU"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>



            <!-- Specifications (JSON) -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Specifications (JSON)</label>
                <textarea name="specifications" rows="4" placeholder='{"key":"value"}'
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Description -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Description</label>
                <textarea name="description" rows="6" placeholder="Enter product description"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Order -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Order</label>
                <input type="number" name="sortOrder" placeholder="Enter display order"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Status -->
            <div class="w-full flex items-center space-x-3 mt-6 md:mt-0">
                <label class="block font-medium text-gray-700">Status</label>
                <input type="checkbox" name="status" value="1" checked
                    class="w-5 h-5 text-blue-600 bg-gray-200 border-gray-300 rounded focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Submit Button -->
            <div class="md:col-span-2 pt-2">
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg">Create Product</button>
            </div>
        </form>

    </div>
    <script>
        document.getElementById('createProductForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
            const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

            if (!csrfToken || !csrfHeader) {
                console.error('CSRF token or header not found');
                return;
            }

            const formData = new FormData(this);

            // Log FormData contents for debugging
            console.log('FormData contents:');
            for (let [key, value] of formData.entries()) {
                if (value instanceof File) {
                    console.log(key, ':', value.name, '(', value.size, 'bytes)');
                } else {
                    console.log(key, ':', value);
                }
            }

            fetch('/admin/products/store', {
                method: 'PUT',
                body: formData,
                headers: {
                    [csrfHeader]: csrfToken,
                }
            })
                .then(res => {
                    console.log('Response status:', res.status);
                    return res.json();
                })
                .then(data => {
                    console.log('Response data:', data);

                    // clear previous errors
                    document.querySelectorAll(".input-error").forEach(el => el.remove());

                    if (!data.success) {
                        if (data.errors && typeof data.errors === 'object') {
                            Object.keys(data.errors).forEach(fieldName => {
                                const field = document.querySelector(`[name="${fieldName}"]`);

                                if (field) {
                                    const errorEl = document.createElement("p");
                                    errorEl.className = "input-error text-red-600 text-sm mt-1";
                                    errorEl.textContent = data.errors[fieldName];

                                    if (field.type === 'file') {
                                        const parentWrapper = field.parentElement;
                                        if (parentWrapper && parentWrapper.hasAttribute('role') &&
                                            parentWrapper.getAttribute('role') === 'button') {
                                            parentWrapper.insertAdjacentElement("afterend", errorEl);
                                        } else {
                                            field.insertAdjacentElement("afterend", errorEl);
                                        }
                                    } else {
                                        field.insertAdjacentElement("afterend", errorEl);
                                    }
                                }
                            });
                        } else if (data.error) {
                            showFlashMessage(data.error, 'error', "Error");
                        }

                        console.log(data.error);
                        return;
                    }

                    showFlashMessage(data.message, 'success', "Success");
                    setTimeout(() => {
                        window.location.href = '/admin/products';
                    }, 1500);
                })
                .catch(error => {
                    console.error('Error:', error);
                    showFlashMessage('An error occurred while creating the product. Please try again.', 'error', "Error");
                });
        });
    </script>
</div>
