<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="admin/layouts/admin_base :: layout(~{::breadcrumb}, ~{::section})">

<!-- Breadcrumb -->
<div th:fragment="breadcrumb" th:replace="admin/components/breadcrumb :: breadcrumb-component(
        'Update Product',
        ~{admin/components/breadcrumb-icons :: icon-pages}
)">
</div>

<div th:fragment="section" class="admin-content">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full">

        <form id="updateProductForm" enctype="multipart/form-data" th:data-id="${product.id}"
            class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Product Name -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Product Name <span
                        class="text-red-500">*</span></label>
                <input type="text" name="name" th:value="${product.name}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Slug -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Slug</label>
                <input type="text" name="slug" th:value="${product.slug}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Thumbnail -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Thumbnail Image <span
                        class="text-red-500">*</span></label>
                <div tabindex="0" role="button"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white cursor-pointer flex items-center justify-between"
                    onclick="this.querySelector('input').click()">
                    <span id="thumbnail-name" class="text-gray-500">Choose File</span>
                    <input type="file" name="image" accept="image/*" class="hidden"
                        onchange="updateFilePreview(this, 'thumbnail-preview', 'thumbnail-name')">
                </div>
                <div
                    th:replace="admin/components/image-preview :: preview('thumbnail-preview','thumbnail-name', ${product?.featureImage})">
                </div>
            </div>

            <!-- Cover Image -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Cover Image <span
                        class="text-red-500">*</span></label>
                <div tabindex="0" role="button"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white cursor-pointer flex items-center justify-between"
                    onclick="this.querySelector('input').click()">
                    <span id="cover-name" class="text-gray-500">Choose File</span>
                    <input type="file" name="coverImage" accept="image/*" class="hidden"
                        onchange="updateFilePreview(this, 'cover-preview', 'cover-name')">
                </div>
                <div
                    th:replace="admin/components/image-preview :: preview('cover-preview','cover-name', ${product?.coverImage})">
                </div>
            </div>

            <!-- Price -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Price <span class="text-red-500">*</span></label>
                <input type="number" name="price" th:value="${product.price}" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Discount Type -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Type</label>
                <select name="discountType"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
                    <option value="">Select Discount Type</option>
                    <option value="percentage" th:selected="${product.discountType == 'percentage'}">Percentage</option>
                    <option value="fixed" th:selected="${product.discountType == 'fixed'}">Fixed Amount</option>
                </select>
            </div>

            <!-- Discount Price -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Price</label>
                <input type="number" name="discountPrice" th:value="${product.discountPrice}" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Discount Percent -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Percent</label>
                <input type="number" name="discountPercent" th:value="${product.discountPercent}" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Currency -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Currency <span class="text-red-500">*</span></label>
                <input type="text" name="currency" th:value="${product.currency}" maxlength="10"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Quantity -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Quantity</label>
                <input type="number" name="quantity" th:value="${product.quantity}" min="0"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- SKU -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">SKU</label>
                <input type="text" name="sku" th:value="${product.sku}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>



            <!-- Specifications JSON -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Specifications (JSON)</label>
                <textarea name="specifications" rows="4" th:text="${product.specifications}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Description -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Description</label>
                <textarea name="description" rows="6" th:text="${product.description}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Order -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Order</label>
                <input type="number" name="sortOrder" th:value="${product.sortOrder}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Status -->
            <div class="w-full flex items-center space-x-3 mt-6 md:mt-0">
                <label class="block font-medium text-gray-700">Status</label>
                <input type="checkbox" name="status" value="1" th:checked="${product.status}"
                    class="w-5 h-5 text-blue-600 bg-gray-200 border-gray-300 rounded focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Submit -->
            <div class="md:col-span-2 pt-2">
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg">Update Product</button>
            </div>

        </form>

    </div>
    <!-- JS for preview + fetch -->
    <script>

        document.getElementById('updateProductForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const id = this.dataset.id;
            const csrfToken = document.querySelector("meta[name='_csrf']").content;
            const csrfHeader = document.querySelector("meta[name='_csrf_header']").content;

            const formData = new FormData(this);

            fetch(`/admin/products/update/${id}`, {
                method: 'PUT',
                body: formData,
                headers: {
                    [csrfHeader]: csrfToken
                }
            })
                .then(res => res.json())
                .then(data => {
                    document.querySelectorAll(".input-error").forEach(el => el.remove());

                    if (!data.success) {
                        if (data.errors && typeof data.errors === 'object') {
                            Object.keys(data.errors).forEach(fieldName => {
                                const field = document.querySelector(`[name="${fieldName}"]`);

                                if (field) {
                                    const errorEl = document.createElement("p");
                                    errorEl.className = "input-error text-red-600 text-sm mt-1";
                                    errorEl.textContent = data.errors[fieldName];

                                    // For file inputs, insert error after the parent button wrapper
                                    if (field.type === 'file') {
                                        const parentWrapper = field.parentElement;

                                        // Check if parent has role="button"
                                        if (parentWrapper && parentWrapper.hasAttribute('role') &&
                                            parentWrapper.getAttribute('role') === 'button') {
                                            parentWrapper.insertAdjacentElement("afterend", errorEl);
                                        } else {
                                            // Fallback to inserting after the field
                                            field.insertAdjacentElement("afterend", errorEl);
                                        }
                                    } else {
                                        // For regular inputs
                                        field.insertAdjacentElement("afterend", errorEl);
                                    }
                                }
                            });
                        }
                        showFlashMessage(data.message || 'Validation failed', 'error', 'Error');
                        return; // stop here, do not redirect
                    }
                    showFlashMessage(data.message, 'success', "Success");

                    setTimeout(() => {
                        window.location.href = '/admin/products';
                    }, 1700);

                })
                .catch(err => console.error("Fetch error:", err));

        });
    </script>

</div>
