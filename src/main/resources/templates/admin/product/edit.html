<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="admin/layouts/admin_base :: layout(~{::breadcrumb}, ~{::section})">

<!-- Breadcrumb -->
<div th:fragment="breadcrumb" th:replace="admin/components/breadcrumb :: breadcrumb-component(
        'Update Product',
        ~{admin/components/breadcrumb-icons :: icon-pages}
)">
</div>

<div th:fragment="section" class="admin-content">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full">

        <form id="updateProductForm" enctype="multipart/form-data" th:data-id="${product.id}"
            class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Product Name -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Product Name <span
                        class="text-red-500">*</span></label>
                <input type="text" name="name" th:value="${product.name}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Slug -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Slug</label>
                <input type="text" name="slug" th:value="${product.slug}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Thumbnail -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Thumbnail Image <span
                        class="text-red-500">*</span></label>
                <div tabindex="0" role="button"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white cursor-pointer flex items-center justify-between"
                    onclick="this.querySelector('input').click()">
                    <span id="thumbnail-name" class="text-gray-500">Choose File</span>
                    <input type="file" name="image" accept="image/*" class="hidden"
                        onchange="updateFilePreview(this, 'thumbnail-preview', 'thumbnail-name')">
                </div>
                <div
                    th:replace="admin/components/image-preview :: preview('thumbnail-preview','thumbnail-name', ${product?.featureImage})">
                </div>
            </div>

            <!-- Cover Image -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Cover Image <span
                        class="text-red-500">*</span></label>
                <div tabindex="0" role="button"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white cursor-pointer flex items-center justify-between"
                    onclick="this.querySelector('input').click()">
                    <span id="cover-name" class="text-gray-500">Choose File</span>
                    <input type="file" name="coverImage" accept="image/*" class="hidden"
                        onchange="updateFilePreview(this, 'cover-preview', 'cover-name')">
                </div>
                <div
                    th:replace="admin/components/image-preview :: preview('cover-preview','cover-name', ${product?.coverImage})">
                </div>
            </div>

            <style>
                .category-item {
                    transition: all 0.3s ease;
                    animation: slideIn 0.3s ease;
                }

                @keyframes slideIn {
                    from {
                        opacity: 0;
                        transform: translateY(-10px);
                    }

                    to {
                        opacity: 1;
                        transform: translateY(0);
                    }
                }

                .dragging {
                    opacity: 0.5;
                    transform: scale(0.95);
                }

                .drag-over {
                    background-color: rgba(59, 130, 246, 0.1);
                    border-color: rgb(59, 130, 246);
                }

                .category-badge {
                    display: inline-flex;
                    align-items: center;
                    gap: 0.5rem;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 0.5rem 0.75rem;
                    border-radius: 0.5rem;
                    font-size: 0.875rem;
                    font-weight: 500;
                    cursor: grab;
                    user-select: none;
                    margin: 0.25rem;
                }

                .category-badge:active {
                    cursor: grabbing;
                }

                .category-badge:hover {
                    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
                    transform: translateY(-2px);
                }

                .available-item {
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    padding: 0.75rem;
                    background: white;
                    border: 1px solid #e5e7eb;
                    border-radius: 0.5rem;
                    cursor: pointer;
                    transition: all 0.2s ease;
                }

                .available-item:hover {
                    background-color: #f3f4f6;
                    border-color: #667eea;
                    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
                }

                .available-item.hidden {
                    display: none;
                }

                .search-input {
                    position: relative;
                }

                .search-input input {
                    padding-left: 2.5rem;
                    padding-right: 2.5rem;
                }

                .search-icon {
                    position: absolute;
                    left: 0.75rem;
                    top: 50%;
                    transform: translateY(-50%);
                    color: #9ca3af;
                    pointer-events: none;
                }

                .clear-search {
                    cursor: pointer;
                    color: #9ca3af;
                    transition: color 0.2s;
                    position: absolute;
                    right: 0.75rem;
                    top: 50%;
                    transform: translateY(-50%);
                }

                .clear-search:hover {
                    color: #374151;
                }

                .empty-state {
                    text-align: center;
                    padding: 2rem;
                    color: #9ca3af;
                }

                .selected-count {
                    display: inline-block;
                    background: #667eea;
                    color: white;
                    padding: 0.25rem 0.5rem;
                    border-radius: 0.25rem;
                    font-size: 0.75rem;
                    font-weight: 600;
                    margin-left: 0.5rem;
                }

                .selection-stats {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 0.75rem;
                    background: #f9fafb;
                    border-radius: 0.5rem;
                    font-size: 0.875rem;
                    color: #6b7280;
                    margin-top: 0.5rem;
                }
            </style>

            <!-- Enhanced Category Assignment UI -->
            <div class="md:col-span-2">
                <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-lg p-5 border border-blue-100">
                    <div class="flex items-center gap-2 mb-2">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 012 12V7a2 2 0 012-2z">
                            </path>
                        </svg>
                        <h2 class="text-lg font-bold text-gray-800">
                            Assign Categories <span class="text-red-500">*</span>
                        </h2>
                    </div>
                    <p class="text-gray-600 text-sm mb-4">Drag items between lists or click to select/deselect
                        categories</p>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- LEFT: Selected Categories -->
                        <div class="flex flex-col h-full">
                            <div
                                class="bg-white border-2 border-blue-200 rounded-lg p-4 flex-1 flex flex-col min-h-[350px]">
                                <div class="flex items-center justify-between mb-4">
                                    <h3 class="font-bold text-gray-800 text-base flex items-center gap-2">
                                        <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                            <path
                                                d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z">
                                            </path>
                                        </svg>
                                        Selected
                                    </h3>
                                    <span class="selected-count" id="selectedCount">0</span>
                                </div>
                                <div id="selectedCategories"
                                    class="flex-1 border-2 border-dashed border-blue-300 rounded-lg p-4 bg-blue-50 overflow-y-auto flex flex-wrap content-start gap-1">
                                    <!-- Selected categories will be inserted here -->
                                </div>
                                <div class="selection-stats">
                                    <span id="selectedStats">No categories selected</span>
                                    <button type="button" id="clearSelected"
                                        class="text-red-500 hover:text-red-700 font-medium text-sm">
                                        Clear All
                                    </button>
                                </div>
                            </div>
                        </div>
                        <!-- RIGHT: Available Categories -->
                        <div class="flex flex-col h-full">
                            <div
                                class="bg-white border-2 border-gray-200 rounded-lg p-4 flex-1 flex flex-col min-h-[350px]">
                                <div class="mb-4">
                                    <h3 class="font-bold text-gray-800 text-base flex items-center gap-2 mb-3">
                                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor"
                                            viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M12 4v16m8-8H4"></path>
                                        </svg>
                                        Available Categories
                                    </h3>
                                    <!-- Search Input -->
                                    <div class="search-input">
                                        <svg class="search-icon w-5 h-5" fill="none" stroke="currentColor"
                                            viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                        </svg>
                                        <input type="text" id="searchCategories" placeholder="Search categories..."
                                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                        <svg class="clear-search w-5 h-5 hidden" id="clearSearch" fill="currentColor"
                                            viewBox="0 0 20 20">
                                            <path fill-rule="evenodd"
                                                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                                                clip-rule="evenodd"></path>
                                        </svg>
                                    </div>
                                </div>
                                <ul id="availableCategories"
                                    class="space-y-2 flex-1 border-2 border-dashed border-gray-300 rounded-lg p-4 bg-gray-50 overflow-y-auto">
                                    <!-- Thymeleaf Loop - Categories from backend -->
                                    <li th:each="cat : ${categories}" th:data-id="${cat.id}"
                                        th:data-title="${cat.title.toLowerCase()}" th:text="${cat.title}"
                                        class="category-item available-item cursor-pointer bg-white border rounded px-3 py-2 shadow-sm hover:bg-gray-100 transition flex items-center justify-between">
                                    </li>
                                </ul>
                                <div id="noResults" class="empty-state hidden">
                                    <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor"
                                        viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                                        </path>
                                    </svg>
                                    <p>No categories found</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Price -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Price <span class="text-red-500">*</span></label>
                <input type="number" name="price" th:value="${product.price}" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Discount Type -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Type</label>
                <select name="discountType"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
                    <option value="">Select Discount Type</option>
                    <option value="percentage" th:selected="${product.discountType == 'percentage'}">Percentage
                    </option>
                    <option value="fixed" th:selected="${product.discountType == 'fixed'}">Fixed Amount</option>
                </select>
            </div>

            <!-- Discount Price -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Price</label>
                <input type="number" name="discountPrice" th:value="${product.discountPrice}" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Discount Percent -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Discount Percent</label>
                <input type="number" name="discountPercent" th:value="${product.discountPercent}" step="0.01"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Currency -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Currency <span class="text-red-500">*</span></label>
                <input type="text" name="currency" th:value="${product.currency}" maxlength="10"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Quantity -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Quantity</label>
                <input type="number" name="quantity" th:value="${product.quantity}" min="0"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- SKU -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">SKU</label>
                <input type="text" name="sku" th:value="${product.sku}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Specifications JSON -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Specifications (JSON)</label>
                <textarea name="specifications" rows="4" th:text="${product.specifications}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Description -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Description</label>
                <textarea name="description" rows="6" th:text="${product.description}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Order -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Order</label>
                <input type="number" name="sortOrder" th:value="${product.sortOrder}"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Status -->
            <div class="w-full flex items-center space-x-3 mt-6 md:mt-0">
                <label class="block font-medium text-gray-700">Status</label>
                <input type="checkbox" name="status" value="1" th:checked="${product.status}"
                    class="w-5 h-5 text-blue-600 bg-gray-200 border-gray-300 rounded focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Submit -->
            <div class="md:col-span-2 pt-2">
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg">Update Product</button>
            </div>
        </form>

    </div>

    <!-- After closing </form> tag, add this: -->
    <div id="categoryData" th:data-categories="${#strings.listJoin(product.categories.![#this.id], ',')}"></div>

    <script>
        const categoryDataEl = document.getElementById("categoryData");
        const productCategoryIds = categoryDataEl.dataset.categories ?
            categoryDataEl.dataset.categories.split(',').map(id => parseInt(id)) : [];
    </script>


    <script>
        // Replace your form submission script with this:

        document.getElementById('updateProductForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const id = this.dataset.id;
            const csrfToken = document.querySelector("meta[name='_csrf']").content;
            const csrfHeader = document.querySelector("meta[name='_csrf_header']").content;

            const formData = new FormData(this);

            fetch(`/admin/products/update/${id}`, {
                method: 'PUT',
                body: formData,
                headers: {
                    [csrfHeader]: csrfToken
                }
            })
                .then(res => res.json())
                .then(data => {
                    // Clear previous errors
                    document.querySelectorAll(".input-error").forEach(el => el.remove());

                    if (!data.success) {
                        if (data.errors && typeof data.errors === 'object') {
                            Object.keys(data.errors).forEach(fieldName => {
                                const errorEl = document.createElement("p");
                                errorEl.className = "input-error text-red-600 text-sm mt-2 mb-2";
                                errorEl.textContent = data.errors[fieldName];

                                if (fieldName === 'categories') {
                                    // For categories, find the category section wrapper and insert after it
                                    const categorySection = document.querySelector(
                                        '.bg-gradient-to-r.from-blue-50');
                                    if (categorySection) {
                                        // Insert after the entire category section
                                        categorySection.parentElement.insertBefore(errorEl,
                                            categorySection.nextSibling);
                                    }
                                } else {
                                    const field = document.querySelector(`[name="${fieldName}"]`);
                                    if (field) {
                                        if (field.type === 'file') {
                                            const parentWrapper = field.parentElement;
                                            if (parentWrapper && parentWrapper.hasAttribute('role') &&
                                                parentWrapper.getAttribute('role') === 'button') {
                                                parentWrapper.insertAdjacentElement("afterend",
                                                    errorEl);
                                            } else {
                                                field.insertAdjacentElement("afterend", errorEl);
                                            }
                                        } else {
                                            field.insertAdjacentElement("afterend", errorEl);
                                        }
                                    }
                                }
                            });
                        }
                        showFlashMessage(data.message || 'Validation failed', 'error', 'Error');
                        return;
                    }
                    showFlashMessage(data.message, 'success', "Success");

                    setTimeout(() => {
                        window.location.href = '/admin/products';
                    }, 1700);

                })
                .catch(err => console.error("Fetch error:", err));
        });
    </script>

    <!-- Category Management Script - UPDATED -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const selectedList = document.getElementById("selectedCategories");
            const availableList = document.getElementById("availableCategories");
            const searchInput = document.getElementById("searchCategories");
            const clearSearchBtn = document.getElementById("clearSearch");
            const noResults = document.getElementById("noResults");
            const selectedCount = document.getElementById("selectedCount");
            const selectedStats = document.getElementById("selectedStats");
            const clearSelectedBtn = document.getElementById("clearSelected");

            let draggingEl = null;

            // productCategoryIds is already set from the category data div
            console.log('Loaded category IDs:', productCategoryIds);

            function updateHiddenInput() {
                // Remove previous hidden inputs
                document.querySelectorAll('input[name="categories"]').forEach(i => i.remove());

                const selected = [...selectedList.querySelectorAll("[data-id]")];
                selected.forEach(li => {
                    const input = document.createElement("input");
                    input.type = "hidden";
                    input.name = "categories";
                    input.value = li.dataset.id;
                    selectedList.appendChild(input);
                });

                selectedCount.textContent = selected.length;
                selectedStats.textContent = selected.length === 0 ?
                    "No categories selected" :
                    `${selected.length} ${selected.length === 1 ? 'category' : 'categories'} selected`;

                // FIX: Clear any existing category errors when user updates selection
                document.querySelectorAll(".input-error").forEach(el => {
                    if (el.textContent.includes("category")) {
                        el.remove();
                    }
                });
            }

            function moveToSelected(item) {
                const clonedItem = item.cloneNode(true);
                clonedItem.className = "category-badge";
                clonedItem.draggable = true;
                clonedItem.dataset.id = item.dataset.id;

                clonedItem.onclick = (e) => {
                    e.stopPropagation();
                    moveToAvailable(clonedItem);
                };

                clonedItem.addEventListener("dragstart", () => {
                    draggingEl = clonedItem;
                    clonedItem.classList.add("dragging");
                });
                clonedItem.addEventListener("dragend", () => {
                    clonedItem.classList.remove("dragging");
                    draggingEl = null;
                });

                selectedList.appendChild(clonedItem);
                updateHiddenInput();
                filterAvailable();
            }

            function moveToAvailable(item) {
                item.remove();
                updateHiddenInput();
                filterAvailable();
            }

            function filterAvailable() {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedIds = new Set([...selectedList.querySelectorAll("[data-id]")].map(el => el.dataset
                    .id));

                let visibleCount = 0;
                availableList.querySelectorAll(".available-item").forEach(item => {
                    const isSelected = selectedIds.has(item.dataset.id);
                    const matchesSearch = item.dataset.title.includes(searchTerm);
                    const shouldShow = !isSelected && matchesSearch;

                    item.classList.toggle("hidden", !shouldShow);
                    if (shouldShow) visibleCount++;
                });

                clearSearchBtn.classList.toggle("hidden", !searchInput.value);
                noResults.classList.toggle("hidden", visibleCount > 0 || !searchInput.value);
            }

            // Setup available items
            availableList.querySelectorAll(".available-item").forEach(item => {
                item.addEventListener("click", () => moveToSelected(item));
                item.draggable = true;
                item.addEventListener("dragstart", () => {
                    draggingEl = item;
                    item.classList.add("dragging");
                });
                item.addEventListener("dragend", () => {
                    item.classList.remove("dragging");
                    draggingEl = null;
                });
            });

            // Search functionality
            searchInput.addEventListener("input", filterAvailable);
            clearSearchBtn.addEventListener("click", () => {
                searchInput.value = "";
                clearSearchBtn.classList.add("hidden");
                filterAvailable();
            });

            // Clear all selected
            clearSelectedBtn.addEventListener("click", () => {
                selectedList.querySelectorAll(".category-badge").forEach(item => item.remove());
                updateHiddenInput();
                filterAvailable();
            });

            // Drag and drop zones
            function setupDropZone(zone) {
                zone.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    zone.classList.add("drag-over");
                });

                zone.addEventListener("dragleave", () => {
                    zone.classList.remove("drag-over");
                });

                zone.addEventListener("drop", (e) => {
                    e.preventDefault();
                    zone.classList.remove("drag-over");

                    if (draggingEl) {
                        if (zone === selectedList) {
                            moveToSelected(draggingEl);
                        } else if (zone === availableList) {
                            moveToAvailable(draggingEl);
                        }
                    }
                });
            }

            setupDropZone(selectedList);
            setupDropZone(availableList);

            // LOAD EXISTING PRODUCT CATEGORIES
            setTimeout(() => {
                console.log('Attempting to load categories:', productCategoryIds);
                productCategoryIds.forEach(catId => {
                    const idStr = String(catId);
                    const item = availableList.querySelector(`[data-id="${idStr}"]`);
                    if (item) {
                        console.log(`Found and loading category: ${idStr}`);
                        moveToSelected(item);
                    } else {
                        console.warn(`Category with ID ${idStr} not found in available list`);
                    }
                });
            }, 100);

            updateHiddenInput();
        });
    </script>

</div>
