<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(breadcrumb,content)">

<head th:replace="admin/fragments/admin_header :: head(${title})"></head>

<body class="bg-gray-100">
    <div id="alert-container" th:replace="admin/components/alert :: custom-alert"></div>


    <nav th:include="admin/fragments/sidebar :: sidebar"></nav>

    <div id="main-content" class="flex-1 p-4 md:p-6">
        <nav class=" bg-white shadow-md rounded-lg p-4 flex justify-between items-center mb-6">

            <span class="font-bold text-xl md:text-2xl text-indigo-600">Dashboard</span>
            <div class="relative">
                <button id="profile-btn"
                    class="w-10 h-10 rounded-full primary-bg text-white flex items-center justify-center font-bold hover:bg-indigo-700 transition">
                    <span
                        th:text="${admin != null and admin.fullName != null ? admin.fullName.substring(0,1).toUpperCase() : 'A'}">A</span>
                </button>
                <div id="profile-menu"
                    class="hidden absolute right-0 mt-2 w-48 bg-white shadow-lg rounded-lg overflow-hidden z-10">
                    <a href="/admin/profile" class="block px-4 py-2 hover:bg-gray-100 transition">Profile</a>
                    <a href="/admin/settings" class="block px-4 py-2 hover:bg-gray-100 transition">Settings</a>
                    <div class="border-t border-gray-200"></div>


                    <a href="#" class="block px-4 py-2 hover:bg-red-50 text-red-600 transition"
                        onclick="document.getElementById('logoutForm').submit(); return false;">
                        <svg class="logout-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        <span class="logout-text">Logout</span>
                    </a>

                    <form id="logoutForm" action="/admin/logout" method="POST" style="display:none;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    </form>


                </div>
            </div>
        </nav>
        <!-- <div th:replace="${content}"></div> -->
        <div class="content-wrapper">
            <div class="">

                <div th:if="${breadcrumb != null}" th:replace="${breadcrumb}"></div>

                <!-- <div th:insert="${content}"></div> -->
                <div th:replace="${content}"></div>
            </div>
        </div>

    </div>

    <script>
        // Profile menu toggle
        const profileBtn = document.getElementById('profile-btn');
        const profileMenu = document.getElementById('profile-menu');

        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            profileMenu.classList.toggle('hidden');
        });

        // Close profile menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!profileBtn.contains(e.target) && !profileMenu.contains(e.target)) {
                profileMenu.classList.add('hidden');
            }
        });
    </script>

    <!-- This will handle redirect messages -->
    <script th:inline="javascript">
        // Check flash attributes first (from RedirectAttributes)
        let serverMessage = /*[[${message}]]*/ null;
        let serverAlertType = /*[[${alertType}]]*/ null;



        console.log('Message:', serverMessage);
        console.log('Alert Type:', serverAlertType);

        if (serverMessage) {
            const title = serverAlertType === 'success' ? 'Success' :
                serverAlertType === 'error' ? 'Error' : 'Info';

            console.log('Showing flash message');
            showFlashMessage(serverMessage, serverAlertType || 'success', title);

            // Clear session attributes after displaying
            // This prevents the message from showing on every page load
            fetch('/admin/clear-flash', { method: 'POST' }).catch(() => { });
        }
    </script>
</body>


</html>
