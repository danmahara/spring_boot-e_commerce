<div th:fragment="sidebar">
    <!-- Hamburger Toggle Button (Mobile Only) -->
    <button onclick="toggleSidebar()" class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <!-- Logo/Header -->
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <svg class="icon-svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <span class="logo-text">Admin<span class="logo-accent">Pro</span></span>
            </div>
        </div>
        <!-- Navigation Menu -->
        <nav class="sidebar-nav">
            <div class="nav-container">
                <!-- Dashboard -->
                <a href="/" target="_blank" data-page="dashboard" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="nav-text">Visit Site</span>
                    <span class="active-indicator"></span>
                </a>
                <!-- Dashboard -->
                <a href="/admin/dashboard" data-page="dashboard" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span class="nav-text">Dashboard</span>
                    <span class="active-indicator"></span>
                </a>
                <!-- Users -->
                <a href="/admin/users" data-page="users" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <span class="nav-text">Users</span>
                    <span class="active-indicator"></span>
                </a>
                <!-- Pages -->
                <a href="/admin/pages" data-page="pages" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span class="nav-text">Pages</span>
                    <span class="active-indicator"></span>
                </a>


                <!-- Products -->
                <a href="/admin/products" data-page="products" class="nav-link">
                    <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 3h2l3 9h8l3-6H6m10 12a1 1 0 110 2 1 1 0 010-2zm-8 0a1 1 0 110 2 1 1 0 010-2z" />
                    </svg>

                    <span class="nav-text">Products</span>
                    <span class="active-indicator"></span>
                </a>


                <!-- Color theme -->
                <a href="/admin/color-reference" data-page="pages" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span class="nav-text">Color Theme</span>
                    <span class="active-indicator"></span>
                </a>

                <!-- Settings -->
                <a href="/admin/settings" data-page="settings" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span class="nav-text">Settings</span>
                    <span class="active-indicator"></span>
                </a>
                <!-- Divider -->
                <div class="nav-divider"></div>
                <!-- Analytics -->
                <a href="/admin/analytics" data-page="analytics" class="nav-link">
                    <svg class="nav-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                    <span class="nav-text">Analytics</span>
                    <span class="active-indicator"></span>
                </a>
            </div>
        </nav>
        <!-- User Profile & Logout -->
        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="user-avatar">
                    <span
                        th:text="${admin != null and admin.fullName != null ? admin.fullName.substring(0,1).toUpperCase() : 'A'}">A</span>
                </div>
                <div class="user-info">
                    <p class="user-name" th:text="${admin != null ? admin.fullName : 'Admin User'}">Admin User</p>
                    <div th:if="${admin.role!=null}" class="flex space-x-2 items-center">
                        <span class="user-role">Role:</span>
                        <p class="user-role" th:text="${admin.role}">Administrator</p>
                    </div>
                </div>
            </div>
            <form id="logoutForm" action="/admin/logout" method="POST" style="display:none;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            </form>
            <a href="#" class="logout-link" onclick="document.getElementById('logoutForm').submit(); return false;">
                <svg class="logout-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span class="logout-text">Logout</span>
            </a>
        </div>
    </aside>
    <!-- Mobile Overlay -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="sidebar-overlay"></div>
    <!-- CSS Styles - NOW USING GLOBAL CSS VARIABLES -->
    <style>
        /* Menu Toggle Button */
        .menu-toggle {
            position: fixed;
            top: var(--spacing-lg);
            left: var(--spacing-lg);
            z-index: 50;
            padding: var(--spacing-md);
            background: var(--gradient-primary);
            color: var(--text-white);
            border: none;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            transition: var(--transition-all);
            display: none;
        }

        .menu-toggle:hover {
            background: var(--gradient-primary-hover);
            transform: scale(1.05);
        }

        .menu-toggle .icon {
            width: 1.5rem;
            height: 1.5rem;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 40;
            height: 100vh;
            width: var(--sidebar-width);
            background: var(--gradient-sidebar);
            box-shadow: var(--shadow-2xl);
            display: flex;
            flex-direction: column;
            transition: transform var(--transition-slow);
        }

        /* Sidebar Header */
        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 5rem;
            border-bottom: 1px solid var(--border-gray-700);
            background: rgba(17, 24, 39, 0.5);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .logo-icon {
            width: 2.5rem;
            height: 2.5rem;
            background: var(--gradient-logo);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon .icon-svg {
            width: 1.5rem;
            height: 1.5rem;
            color: var(--text-white);
        }

        .logo-text {
            font-size: var(--text-2xl);
            font-weight: bold;
            color: var(--text-white);
        }

        .logo-accent {
            color: var(--primary-bg);
        }

        /* Navigation */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-xl) var(--spacing-md);
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            color: var(--text-gray-300);
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: var(--transition-all);
            position: relative;
        }

        .nav-link:hover {
            background: var(--bg-dark-700);
            transform: translateX(4px);
        }

        .nav-link.active {
            /* background: var(--gradient-primary); */
            background: var(--primary-bg);
            color: var(--text-white);
            box-shadow: var(--shadow-primary);
        }

        .nav-icon {
            width: 1.25rem;
            height: 1.25rem;
        }

        .nav-text {
            font-weight: 500;
        }

        .active-indicator {
            margin-left: auto;
            width: 0.5rem;
            height: 0.5rem;
            background: var(--text-white);
            border-radius: var(--radius-full);
            display: none;
        }

        .nav-link.active .active-indicator {
            display: block;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .nav-divider {
            margin: var(--spacing-xl) 0;
            border-top: 1px solid var(--border-gray-700);
        }

        /* Sidebar Footer */
        .sidebar-footer {
            border-top: 1px solid var(--border-gray-700);
            padding: var(--spacing-lg);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: rgba(31, 41, 55, 0.5);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-md);
        }

        .user-avatar {
            width: 2.5rem;
            height: 2.5rem;
            background: var(--gradient-avatar);
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-white);
            font-weight: bold;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: var(--text-sm);
            font-weight: 500;
            color: var(--text-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin: 0;
        }

        .user-role {
            font-size: var(--text-xs);
            color: var(--text-gray-400);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-link {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: 0.625rem var(--spacing-lg);
            color: var(--text-gray-300);
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: var(--transition-all);
        }

        .logout-link:hover {
            background: var(--danger-600);
            color: var(--text-white);
            transform: translateX(4px);
        }

        .logout-icon {
            width: 1.25rem;
            height: 1.25rem;
        }

        .logout-text {
            font-weight: 500;
        }

        /* Mobile Overlay */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 30;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow), visibility var(--transition-slow);
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Mobile Styles */
        @media (max-width: 767px) {
            .menu-toggle {
                display: block;
            }

            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.active {
                transform: translateX(0);
            }
        }

        /* Desktop Styles - Sidebar always visible */
        @media (min-width: 768px) {
            .sidebar {
                transform: translateX(0) !important;
            }

            .sidebar-overlay {
                display: none !important;
            }
        }
    </style>
    <!-- JavaScript -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const toggleBtn = document.getElementById('menu-toggle');
            const isActive = sidebar.classList.contains('active');
            // Toggle sidebar
            sidebar.classList.toggle('active');
            // Toggle overlay
            overlay.classList.toggle('active');
            // Toggle hamburger ↔ X icon
            toggleBtn.innerHTML = !isActive
                ? `<svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                   </svg>`
                : `<svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                     <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                   </svg>`;
        }
        // Highlight active menu item based on current URL
        document.addEventListener('DOMContentLoaded', function () {
            const currentPath = window.location.pathname;
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                const linkPath = link.getAttribute('href');
                if (currentPath === linkPath || currentPath.startsWith(linkPath + '/')) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</div>
