<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="admin/layouts/admin_base :: layout(~{::breadcrumb}, ~{::section})">
<div th:fragment="breadcrumb" th:replace="admin/components/breadcrumb :: breadcrumb-component(
         'Edit Permission',
         ~{admin/components/breadcrumb-icons :: icon-pages}
        )">
</div>
<div th:fragment="section" class="admin-content">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full">
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900"></div>
            <p class="mt-2 text-gray-600">Loading permission data...</p>
        </div>

        <!-- Edit Form (Hidden initially) -->
        <form id="editPermissionForm" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            <input type="hidden" name="id" id="permissionId">

            <!-- Permission Name (Read-only) -->
            <div>
                <label class="block mb-1 font-medium text-gray-700">
                    Permission Name <span class="text-red-500">*</span>
                </label>
                <input type="text" name="name"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)] cursor-not-allowed"
                    readonly title="Permission name cannot be changed">
                <p class="text-xs text-gray-500 mt-1">Permission name cannot be modified</p>
            </div>

            <!-- Resource (Read-only) -->
            <div>
                <label class="block mb-1 font-medium text-gray-700">
                    Resource <span class="text-red-500">*</span>
                </label>
                <input type="text" name="resource"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)] cursor-not-allowed"
                    readonly title="Resource cannot be changed">
                <p class="text-xs text-gray-500 mt-1">Resource cannot be modified</p>
            </div>

            <!-- Action (Read-only) -->
            <div>
                <label class="block mb-1 font-medium text-gray-700">
                    Action <span class="text-red-500">*</span>
                </label>
                <select name="action"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full bg-gray-100 cursor-not-allowed" disabled>
                    <option value="">Select action</option>
                    <option value="CREATE">CREATE</option>
                    <option value="READ">READ</option>
                    <option value="UPDATE">UPDATE</option>
                    <option value="DELETE">DELETE</option>
                </select>
                <p class="text-xs text-gray-500 mt-1">Action cannot be modified</p>
            </div>

            <!-- Status -->
            <div class="flex items-center space-x-3">
                <label class="block font-medium text-gray-700">Status</label>
                <input type="hidden" name="isActive" value="false">
                <input type="checkbox" name="isActive" value="true" style="color: var(--primary-bg) !important;"
                    class="w-5 h-5 text-blue-600 bg-gray-200 border-gray-300 rounded focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Description (Full Width) -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">
                    Description <span class="text-red-500">*</span>
                </label>
                <textarea name="description" rows="6" placeholder="Describe what this permission allows..."
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"
                    required minlength="10" maxlength="500"></textarea>
                <p class="text-xs text-gray-500 mt-1">Minimum 10 characters, maximum 500 characters</p>
            </div>

            <!-- Submit Buttons -->
            <div class="md:col-span-2 pt-2 flex space-x-3">
                <button type="submit" class="primary-btn px-6 py-2 rounded-lg">
                    Update Permission
                </button>
                <a href="/admin/permissions" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <script>
        // Get permission ID from URL
        const urlParts = window.location.pathname.split('/');
        const permissionId = urlParts[urlParts.length - 1];

        // Fetch permission data on page load
        document.addEventListener('DOMContentLoaded', function () {
            fetchPermissionData(permissionId);
        });

        function fetchPermissionData(id) {
            fetch(`/api/admin/permissions/${id}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Permission not found');
                    }
                    return response.json();
                })
                .then(apiResponse => {
                    if (!apiResponse.success) {
                        throw new Error(apiResponse.message || 'Failed to fetch permission');
                    }

                    const permission = apiResponse.data;
                    populateForm(permission);
                })
                .catch(error => {
                    console.error('Error fetching permission:', error);
                    showFlashMessage(error.message || 'Failed to load permission data', 'error', 'Error');
                    setTimeout(() => {
                        window.location.href = '/admin/permissions';
                    }, 2000);
                });
        }

        function populateForm(permission) {
            // Hide loading, show form
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('editPermissionForm').classList.remove('hidden');

            // Populate form fields
            document.getElementById('permissionId').value = permission.id;
            document.querySelector('[name="name"]').value = permission.name;
            document.querySelector('[name="description"]').value = permission.description || '';
            document.querySelector('[name="resource"]').value = permission.resource;
            document.querySelector('[name="action"]').value = permission.action;

            // Set checkbox state
            const checkbox = document.querySelector('[name="isActive"][type="checkbox"]');
            checkbox.checked = permission.isActive;
        }

        // Handle form submission
        document.getElementById('editPermissionForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
            const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

            if (!csrfToken || !csrfHeader) {
                console.error('CSRF token or header not found');
                showFlashMessage('Security token not found', 'error', 'Error');
                return;
            }

            // Clear previous errors
            document.querySelectorAll(".input-error").forEach(el => el.remove());
            document.querySelectorAll("input, select, textarea").forEach(el => {
                el.classList.remove("border-red-500");
            });

            const id = document.getElementById('permissionId').value;

            // Create JSON object
            const formData = {
                name: document.querySelector('[name="name"]').value.trim(),
                description: document.querySelector('[name="description"]').value.trim(),
                resource: document.querySelector('[name="resource"]').value.trim(),
                action: document.querySelector('[name="action"]').value,
                isActive: document.querySelector('[name="isActive"]:checked')?.value === 'true'
            };

            // Disable submit button
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Updating...';

            fetch(`/api/admin/permissions/${id}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken,
                },
                body: JSON.stringify(formData)
            })
                .then(res => {
                    const contentType = res.headers.get('content-type');

                    if (res.redirected) {
                        showFlashMessage(res.message, 'success', 'Success');
                        setTimeout(() => {
                            window.location.href = res.url;
                        }, 2000);
                        return;
                    }

                    if (contentType && contentType.includes('application/json')) {
                        return res.json();
                    } else {
                        throw new Error('Unexpected response format');
                    }
                })
                .then(data => {
                    if (!data) return;

                    if (!data.success) {
                        // Handle validation errors
                        if (data.errors && typeof data.errors === 'object') {
                            Object.keys(data.errors).forEach(fieldName => {
                                const field = document.querySelector(`[name="${fieldName}"]`);
                                if (field && !field.readOnly && !field.disabled) {
                                    // Add red border to field
                                    field.classList.add("border-red-500");

                                    // Create error message
                                    const errorEl = document.createElement("p");
                                    errorEl.className = "input-error text-red-600 text-sm mt-1";
                                    errorEl.textContent = data.errors[fieldName];

                                    // Insert error message after field
                                    field.insertAdjacentElement("afterend", errorEl);
                                }
                            });

                            showFlashMessage(data.message || 'Validation failed', 'error', 'Failed');
                        } else {
                            showFlashMessage(data.message || 'Failed to update permission', 'error', 'Error');
                        }

                        // Re-enable submit button
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                        return;
                    }

                    // Success
                    showFlashMessage(data.message || 'Permission updated successfully', 'success', "Success");
                    setTimeout(() => {
                        window.location.href = '/admin/permissions';
                    }, 1700);
                })
                .catch(error => {
                    console.error('Error:', error);
                    showFlashMessage('An error occurred while updating the permission. Please try again.', 'error', 'Error');

                    // Re-enable submit button
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                });
        });
    </script>
</div>

</html>
