<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    th:replace="admin/layouts/admin_base :: layout(~{::breadcrumb}, ~{::section})">

<div th:fragment="breadcrumb" th:replace="admin/components/breadcrumb :: breadcrumb-component(
         'Create Page',
         ~{admin/components/breadcrumb-icons :: icon-pages}
        )">
</div>

<div th:fragment="section" class="admin-content">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full">

        <!-- <form th:action="@{/admin/pages/store}" th:method="post" enctype="multipart/form-data"
            class="grid grid-cols-1 md:grid-cols-2 gap-6"> -->
        <form id="createPageForm" enctype="multipart/form-data" class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Title -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Page Title</label>
                <input type="text" name="title" placeholder="Enter page title" class="px-3 py-2 border border-gray-300 rounded-lg w-full 
         focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Slug -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Slug</label>
                <input type="text" name="slug" placeholder="Enter page slug (optional)"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
            </div>

            <!-- Thumbnail Image -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Thumbnail Image</label>
                <label
                    class="flex items-center px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-200 transition">
                    <span class="text-gray-700">Choose File</span>
                    <input type="file" name="image" class="hidden" accept="image/*"
                        onchange="updateFilePreview(this, 'thumbnail-preview', 'thumbnail-name')">
                </label>
                <span id="thumbnail-name" class="text-gray-500 text-sm mt-1 block hidden"></span>
                <img id="thumbnail-preview" src="" alt="Thumbnail Preview"
                    class="w-32 h-32 object-cover border border-gray-300 rounded-lg mt-2 hidden">
            </div>

            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Cover Image</label>
                <label
                    class="flex items-center px-4 py-2 bg-gray-100 border border-gray-300 rounded-lg cursor-pointer hover:bg-gray-200 transition">
                    <span class="text-gray-700">Choose File</span>
                    <input type="file" name="cover_image" class="hidden" accept="image/*"
                        onchange="updateFilePreview(this, 'cover-preview', 'cover-name')">
                </label>
                <span id="cover-name" class="text-gray-500 text-sm mt-1 block hidden"></span>
                <img id="cover-preview" src="" alt="Cover Preview"
                    class="w-32 h-32 object-cover border border-gray-300 rounded-lg mt-2 hidden">
            </div>

            <script>
                function updateFilePreview(input, imgId, spanId) {
                    const file = input.files[0];
                    const preview = document.getElementById(imgId);
                    const nameSpan = document.getElementById(spanId);

                    if (file) {
                        nameSpan.textContent = file.name;
                        nameSpan.classList.remove('hidden'); // show file name
                        preview.src = URL.createObjectURL(file); // temporary preview
                        preview.classList.remove('hidden'); // show image
                    } else {
                        nameSpan.textContent = "";
                        nameSpan.classList.add('hidden');
                        preview.src = "";
                        preview.classList.add('hidden');
                    }
                }
            </script>


            <!-- Template Selection -->
            <div class="w-full">
                <label class="block mb-1 font-medium text-gray-700">Template</label>
                <select name="templateName"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]">
                    <option value="">-- Select Template --</option>
                    <option th:each="template : ${templates}" th:value="${template.templateName}"
                        th:text="${#strings.capitalizeWords(template.templateName.replace('_', ' '))}">
                    </option>

                    <!-- <option th:each="template : ${templates}" th:value="${template.templateName}"
                        th:text="${template.templateName}">
                    </option> -->
                </select>
            </div>



            <!-- Content (Full Width) -->
            <div class="w-full md:col-span-2">
                <label class="block mb-1 font-medium text-gray-700">Content</label>
                <textarea name="description" rows="6" placeholder="Enter page content"
                    class="px-3 py-2 border border-gray-300 rounded-lg w-full focus:outline-none focus:ring-2 focus:ring-[var(--primary-bg)]"></textarea>
            </div>

            <!-- Status -->
            <div class="w-full flex items-center space-x-3 mt-6 md:mt-0">
                <label class="block font-medium text-gray-700">Status</label>

                <!-- Hidden input for unchecked state -->
                <input type="hidden" name="status" value="0">

                <!-- Checkbox for checked state -->
                <input type="checkbox" name="status" value="1" checked class="w-5 h-5 text-blue-600 bg-gray-200 border-gray-300 rounded focus:ring-2 focus:ring-[var(--primary-bg)]
                  dark:bg-gray-700 dark:border-gray-600 dark:focus:ring-[var(--primary-bg)]">
            </div>


            <!-- Submit Button (Full Width) -->

            <div class=" md:col-span-2 pt-2">
                <button type="submit" class="primary-btn  px-6 py-2 rounded-lg  ">
                    Create Page
                </button>
            </div>


        </form>
    </div>
    <script>
        document.getElementById('createPageForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const csrfToken = document.querySelector("meta[name='_csrf']")?.content;
            const csrfHeader = document.querySelector("meta[name='_csrf_header']")?.content;

            if (!csrfToken || !csrfHeader) {
                console.error('CSRF token or header not found');
                return;
            }
            const formData = new FormData(this);

            fetch('/admin/pages/store', {
                method: 'POST',
                body: formData,
                headers: {
                    [csrfHeader]: csrfToken,
                }
            })
                .then(res => res.json())
                .then(data => {
                    const flash = document.getElementById('flashMessage');
                    const text = flash.querySelector('.flash-text');

                    if (data.success) {
                        flash.className = 'flash-notification flash-success show';
                        text.textContent = data.message;
                        window.location.href = '/admin/pages';
                    } else {
                        flash.className = 'flash-notification flash-error show';
                        text.textContent = data.message;
                        console.log(data.message);

                    }

                    flash.style.display = 'block';
                    setTimeout(() => {
                        flash.classList.add('hide');
                        setTimeout(() => flash.style.display = 'none', 500);
                    }, 3000);
                })
                .catch(err => console.error(err));
        });
    </script>
</div>
