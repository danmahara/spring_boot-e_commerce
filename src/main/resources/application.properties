spring.application.name=ecommerce_shop

# Flyway migrations run automatically
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Flyway schema history table (optional)
spring.flyway.table=flyway_schema_history



spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_spring
# Connection pool (Hikari is default)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Hibernate validates entity vs DB schema
spring.jpa.hibernate.ddl-auto= validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


spring.thymeleaf.cache=false

# debug=true



# Logging
logging.level.com.ecommerce=DEBUG
logging.level.org.springframework.web=DEBUG



#  Image Configuration
# spring.servlet.multipart.enabled=true   

app.images.uploadDir=uploads
app.images.maxFileSize=5242880
app.images.allowedTypes=image/jpeg,image/png,image/gif,image/webp


# Spring Multipart Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# threashold
spring.servlet.multipart.file-size-threshold=1KB


